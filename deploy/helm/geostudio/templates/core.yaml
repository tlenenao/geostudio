{{- $fn := include "geostudio.fullname" . -}}
{{- $sel := dict "root" . "component" "core" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-core
  labels:
    {{- include "geostudio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.core.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      {{- include "geostudio.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geostudio.selector" $sel | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "geostudio.selector" $sel | nindent 22 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: core
          image: {{ include "geostudio.image" (dict "root" . "name" "core") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Migrations : Job hook pré-install/pré-upgrade (migrations-job.yaml, AUD-033), pas au démarrage.
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8200"]
          ports:
            - {name: http, containerPort: 8200}
          envFrom:
            - configMapRef: {name: {{ $fn }}-config}
          env:
            - {name: OTEL_SERVICE_NAME, value: geostudio-core}
            {{- include "geostudio.secretEnv" (dict "root" . "optional" false "names" (list "DATABASE_URL" "CORE_SECRETS_MASTER_KEY" "S3_ACCESS_KEY" "S3_SECRET_KEY")) | nindent 12 }}
            {{- include "geostudio.secretEnv" (dict "root" . "optional" true "names" (list "CORE_LLM_API_KEY" "CORE_EMBEDDING_API_KEY" "CORE_EXPORT_TOKEN_SECRET" "CORE_SHARE_LINK_TOKEN_SECRET" "CORE_ADMIN_TOOLS_TOKEN_SECRET" "CORE_MIGRATION_DATABASE_URL")) | nindent 12 }}
          # compose : test urllib sur /health, start_period 180s (migrations), interval 15s, retries 5
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources: {{ toYaml .Values.core.resources | nindent 12 }}
          securityContext:
            {{- include "geostudio.securityContext" (dict "uid" .Values.core.podSecurityUid) | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-core
  labels:
    {{- include "geostudio.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "geostudio.selector" $sel | nindent 4 }}
  ports:
    - {name: http, port: 8200, targetPort: http}
{{- if gt (int .Values.core.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $fn }}-core
  labels:
    {{- include "geostudio.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.core.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "geostudio.selector" $sel | nindent 6 }}
{{- end }}
