{{- $cfg := deepCopy .Values.config -}}
{{- $fn := include "geostudio.fullname" . -}}
{{- if not $cfg.SHELL_BASE_URL }}{{- $_ := set $cfg "SHELL_BASE_URL" (printf "http://%s-shell:8300" $fn) }}{{- end }}
{{- if and .Values.valhalla.enabled (not $cfg.CORE_ROUTING_URL) }}{{- $_ := set $cfg "CORE_ROUTING_URL" (printf "http://%s-valhalla:8002" $fn) }}{{- end }}
{{- /* service.version des traces/logs (AUD-040) et tag des bundles autoportés = tag d'image du release */}}
{{- $_ := set $cfg "GEOSTUDIO_VERSION" (.Values.image.tag | default .Chart.AppVersion | toString) }}
{{- if and .Values.observability.enabled (not $cfg.OTEL_EXPORTER_OTLP_ENDPOINT) }}{{- $_ := set $cfg "OTEL_EXPORTER_OTLP_ENDPOINT" (printf "http://%s-otel-lgtm:4318" $fn) }}{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fn }}-config
  labels:
    {{- include "geostudio.labels" . | nindent 4 }}
data:
  {{- range $k, $v := $cfg }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
