{{- if .Values.cdcWorker.enabled }}
{{- $fn := include "geostudio.fullname" . -}}
{{- $sel := dict "root" . "component" "cdc-worker" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-cdc-worker
  labels:
    {{- include "geostudio.labels" . | nindent 4 }}
spec:
  # Mono-writer (slot de réplication logique) garanti par l'élection `app.cdc.election` (verrou
  # consultatif Postgres) : N pods sont sûrs, un seul consomme. RollingUpdate sans surcharge.
  replicas: {{ .Values.cdcWorker.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      {{- include "geostudio.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geostudio.selector" $sel | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: cdc-worker
          image: {{ include "geostudio.image" (dict "root" . "name" "core") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.cdc.main"]
          envFrom:
            - configMapRef: {name: {{ $fn }}-config}
          env:
            - {name: OTEL_SERVICE_NAME, value: geostudio-cdc-worker}
            {{- include "geostudio.secretEnv" (dict "root" . "optional" false "names" (list "CDC_DATABASE_URL" "S3_ACCESS_KEY" "S3_SECRET_KEY")) | nindent 12 }}
          startupProbe:
            exec: &probe
              command: ["python", "-m", "scripts.healthcheck_cdc"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec: *probe
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources: {{ toYaml .Values.cdcWorker.resources | nindent 12 }}
          securityContext:
            {{- include "geostudio.securityContext" (dict "uid" .Values.cdcWorker.podSecurityUid) | nindent 12 }}
{{- end }}
