{{- $fn := include "geostudio.fullname" . -}}
{{- $sel := dict "root" . "component" "worker" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fn }}-worker
  labels:
    {{- include "geostudio.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "geostudio.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "geostudio.selector" $sel | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "geostudio.image" (dict "root" . "name" "core") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - python -m scripts.ensure_procrastinate_schema && python -m procrastinate --app app.jobs.app worker -c {{ .Values.worker.concurrency }} -q {{ join "," .Values.worker.queues }}
          envFrom:
            - configMapRef: {name: {{ $fn }}-config}
          env:
            - {name: OTEL_SERVICE_NAME, value: geostudio-worker}
            {{- include "geostudio.secretEnv" (dict "root" . "optional" false "names" (list "DATABASE_URL" "CORE_SECRETS_MASTER_KEY" "S3_ACCESS_KEY" "S3_SECRET_KEY")) | nindent 12 }}
            {{- include "geostudio.secretEnv" (dict "root" . "optional" true "names" (list "CORE_EMBEDDING_API_KEY")) | nindent 12 }}
          # compose : mêmes commandes, interval 30s, timeout 10s, retries 3, start_period 60s
          startupProbe:
            exec: &probe
              command: ["sh", "-c", "python -m procrastinate --app app.jobs.app healthchecks && python -m scripts.healthcheck_worker_stalled"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec: *probe
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources: {{ toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "geostudio.securityContext" (dict "uid" .Values.worker.podSecurityUid) | nindent 12 }}
          volumeMounts:
            - {name: scratch, mountPath: /scratch}
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: {{ .Values.worker.scratchSizeLimit }}}
