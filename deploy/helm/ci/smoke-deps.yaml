# Dépendances EXTERNES du chart pour la fumée sur kind (jamais pour une vraie installation : un seul
# pod, volume éphémère, identifiants jetables). Voir .github/workflows/helm-chart.yml.
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgis}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgis}}
  template:
    metadata: {labels: {app: postgis}}
    spec:
      containers:
        - name: postgis
          image: ghcr.io/tlenenao/geostudio-postgis:v0.1.0
          args: ["-c", "wal_level=logical"]
          env:
            - {name: POSTGRES_DB, value: gis}
            - {name: POSTGRES_USER, value: gis}
            - {name: POSTGRES_PASSWORD, value: gis}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "gis"]}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: postgis}
spec:
  selector: {app: postgis}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio}}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
        - name: minio
          image: ghcr.io/tlenenao/geostudio-minio:edge
          args: ["server", "/data"]
          env:
            - {name: MINIO_ROOT_USER, value: smoke-user}
            - {name: MINIO_ROOT_PASSWORD, value: smoke-password}
          readinessProbe:
            httpGet: {path: /minio/health/live, port: 9000}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: minio}
spec:
  selector: {app: minio}
  ports: [{port: 9000}]
