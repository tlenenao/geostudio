receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - http://*
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: "opentelemetry-collector"
          scrape_interval: 1s
          static_configs:
            - targets: ["127.0.0.1:8888"]
  # Ajouté par SP-10b : scrape de Martin (/_/metrics, disponible depuis
  # v0.18.0 — cf. Task 1 Step 2) et de postgres-exporter. Nommé
  # `prometheus/geostudio` (pas un `prometheus:` nu) pour rester cohérent
  # avec la convention type/instance déjà utilisée par `prometheus/collector`
  # ci-dessus — les deux sont des instances distinctes du même receiver type.
  prometheus/geostudio:
    config:
      scrape_configs:
        - job_name: martin
          scrape_interval: 15s
          metrics_path: /_/metrics
          static_configs:
            - targets: ["martin:3000"]
        - job_name: postgres
          scrape_interval: 15s
          static_configs:
            - targets: ["postgres-exporter:9187"]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: "/ready"

processors:
  batch:

exporters:
  otlphttp/metrics:
    endpoint: http://127.0.0.1:9090/api/v1/otlp
    tls:
      insecure: true
  otlphttp/traces:
    endpoint: http://127.0.0.1:4418
    tls:
      insecure: true
  otlphttp/logs:
    endpoint: http://127.0.0.1:3100/otlp
    tls:
      insecure: true
  otlp/profiles:
    endpoint: http://127.0.0.1:4040
    tls:
      insecure: true
  debug/metrics:
    verbosity: detailed
  debug/traces:
    verbosity: detailed
  debug/logs:
    verbosity: detailed

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/traces]
    metrics:
      # prometheus/geostudio ajouté par SP-10b, à côté de otlp et
      # prometheus/collector déjà présents par défaut.
      receivers: [otlp, prometheus/collector, prometheus/geostudio]
      processors: [batch]
      exporters: [otlphttp/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs]
    profiles:
      receivers: [otlp]
      exporters: [otlp/profiles]
