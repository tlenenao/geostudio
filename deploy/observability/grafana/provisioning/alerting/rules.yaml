apiVersion: 1
groups:
  - orgId: 1
    name: SLO
    folder: SLO
    interval: 1m
    rules:
      - uid: slo-api-features-latency-p95
        title: "SLO: latence API Features P95 < 200ms"
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum(rate(http_server_duration_milliseconds_bucket{http_target=~"/v1/collections/.*/items.*"}[5m])) by (le))
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [200]}
              refId: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning, slo: api-features-latency}
        annotations: {summary: "Latence P95 des routes OGC API Features au-dessus de 200ms depuis 5 minutes", runbook_url: "https://github.com/tlenenao/geostudio/blob/main/docs/runbooks/2026-10-17-astreinte-alertes.md#slo-api-features-latency-p95"}
        isPaused: false

      - uid: slo-martin-tiles-latency-p95
        title: "SLO: latence tuiles Martin P95 < 50ms"
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum(rate(martin_http_requests_duration_seconds_bucket{endpoint="/{source_ids}/{z}/{x}/{y}"}[5m])) by (le))
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.05]}
              refId: B
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: {severity: warning, slo: martin-tiles-latency}
        annotations: {summary: "Latence P95 des tuiles Martin au-dessus de 50ms depuis 5 minutes", runbook_url: "https://github.com/tlenenao/geostudio/blob/main/docs/runbooks/2026-10-17-astreinte-alertes.md#slo-martin-tiles-latency-p95"}
        isPaused: false

      - uid: slo-jobs-backlog
        title: "SLO: backlog de jobs sous seuil"
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              editorMode: code
              expr: sum(geostudio_jobs_backlog)
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                # Seuil provisoire (aucun trafic réel pour le calibrer) —
                # ajustable sans changer la structure de la règle.
                - evaluator: {type: gt, params: [50]}
              refId: B
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: warning, slo: jobs-backlog}
        annotations: {summary: "Backlog de jobs procrastinate au-dessus du seuil depuis 5 minutes", runbook_url: "https://github.com/tlenenao/geostudio/blob/main/docs/runbooks/2026-10-17-astreinte-alertes.md#slo-jobs-backlog"}
        isPaused: false

      - uid: slo-api-5xx-rate
        title: "SLO: taux de 5xx < 1%"
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              editorMode: code
              expr: (sum(rate(http_server_duration_milliseconds_count{http_status_code=~"5.."}[5m])) or vector(0)) / sum(rate(http_server_duration_milliseconds_count[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0.01]}
              refId: B
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical, slo: api-5xx-rate}
        annotations: {summary: "Taux de réponses 5xx au-dessus de 1% depuis 5 minutes", runbook_url: "https://github.com/tlenenao/geostudio/blob/main/docs/runbooks/2026-10-17-astreinte-alertes.md#slo-api-5xx-rate"}
        isPaused: false

      # ── Exploitation (AUD-035, SP-L3) ──────────────────────────────
      # NoData = Alerting partout : la série disparaît précisément quand le
      # processus qui l'émet (cdc-worker, core, postgres-exporter) est mort.
      # PAS de règle sur geostudio_cdc_lag_seconds : cette jauge mesure le
      # temps depuis le dernier flush d'une collection, qui croît sans fin
      # sur une collection simplement inactive (app/cdc/main.py, flush sur
      # changement seulement) — elle sonnerait sur toute instance au repos.
      # Le vrai retard est le WAL non consommé du slot (ops-cdc-slot-wal) et
      # l'absence de consommateur (ops-cdc-slot-inactive).
      - uid: ops-cdc-slot-inactive
        title: "Exploitation: slot CDC tenu par le cdc-worker"
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              editorMode: code
              expr: min(pg_replication_slots_active{slot_name="geostudio_cdc_slot"})
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: lt, params: [1]}
              refId: B
        for: 10m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical, slo: ops-cdc-slot-inactive}
        annotations: {summary: "Aucun consommateur ne tient le slot de réplication CDC depuis 10 minutes : cdc-worker arrêté ou en boucle de redémarrage, le WAL s'accumule", runbook_url: "https://github.com/tlenenao/geostudio/blob/main/docs/runbooks/2026-10-17-astreinte-alertes.md#ops-cdc-slot-inactive"}
        isPaused: false

      - uid: ops-cdc-slot-wal
        title: "Exploitation: WAL retenu par le slot CDC < 5 Gio"
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              editorMode: code
              expr: max(pg_replication_slots_pg_wal_lsn_diff{slot_name="geostudio_cdc_slot"})
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [5368709120]}
              refId: B
        for: 10m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: critical, slo: ops-cdc-slot-wal}
        annotations: {summary: "Le slot de réplication CDC retient plus de 5 Gio de WAL : pg_wal grossit jusqu'à saturer le disque de Postgres", runbook_url: "https://github.com/tlenenao/geostudio/blob/main/docs/runbooks/2026-10-17-astreinte-alertes.md#ops-cdc-slot-wal"}
        isPaused: false

      - uid: ops-jobs-failed
        title: "Exploitation: aucun job en échec sur 24 h"
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              editorMode: code
              expr: sum(geostudio_jobs_failed)
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [0]}
              refId: B
        for: 0s
        noDataState: Alerting
        execErrState: Error
        labels: {severity: warning, slo: ops-jobs-failed}
        annotations: {summary: "Au moins un job procrastinate est passé en échec dans les dernières 24 heures", runbook_url: "https://github.com/tlenenao/geostudio/blob/main/docs/runbooks/2026-10-17-astreinte-alertes.md#ops-jobs-failed"}
        isPaused: false

      - uid: ops-jobs-oldest-age
        title: "Exploitation: aucun job exigible en attente depuis plus de 30 min"
        condition: B
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model:
              editorMode: code
              expr: max(geostudio_jobs_oldest_age_seconds)
              instant: true
              refId: A
          - refId: B
            datasourceUid: "__expr__"
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: {type: gt, params: [1800]}
              refId: B
        for: 5m
        noDataState: Alerting
        execErrState: Error
        labels: {severity: warning, slo: ops-jobs-oldest-age}
        annotations: {summary: "Un job exigible attend un worker depuis plus de 30 minutes : worker arrêté, file non consommée ou saturée", runbook_url: "https://github.com/tlenenao/geostudio/blob/main/docs/runbooks/2026-10-17-astreinte-alertes.md#ops-jobs-oldest-age"}
        isPaused: false

  # Dossier séparé, volontairement distinct de SLO : preuve reproductible
  # que le pipeline d'alerting fonctionne bout en bout (condition
  # mathématique triviale, ne dépend d'aucune métrique/trafic réel),
  # PAS un SLO. isPaused: true par défaut — mettre à `false` juste avant
  # une démo pour observer l'état "firing" en quelques secondes, remettre
  # à `true` ensuite (ne pas laisser cette règle active en continu : elle
  # sonne toujours vraie par construction, cf. Task 6 Step 5).
  - orgId: 1
    name: test-alert-do-not-keep-in-prod
    folder: SLO-test-alert-do-not-keep-in-prod
    interval: 10s
    rules:
      - uid: test-alert-always-firing
        title: "TEST — preuve que le pipeline d'alerting fonctionne (pas un SLO)"
        condition: A
        data:
          - refId: A
            datasourceUid: "__expr__"
            model:
              type: math
              expression: "1 == 1"
              refId: A
        for: 0s
        noDataState: OK
        execErrState: Alerting
        labels: {severity: test}
        annotations: {summary: "Alerte de test toujours déclenchée — preuve du pipeline d'alerting, à laisser en pause hors démo"}
        isPaused: true
