geostudio_repo_url: "https://github.com/tlenenao/geostudio.git"
geostudio_repo_dest: "/home/geostudio/geostudio"
geostudio_public_host: ""
# Hôte S3 public (liens présignés exports/app-exports, REV-315) : à faire pointer
# vers Traefik par DNS. Vide = non réglé (l'installeur avertit).
geostudio_s3_public_host: ""
geostudio_profiles: ""
geostudio_seed_demo: false
geostudio_core_etl_enabled: false
# Tag de release déployé : révision du dépôt cloné ET tag des images (.env). Doit
# rester égal à GEOSTUDIO_VERSION de .env.example (garde : test_deployability).
geostudio_version: "v0.1.0"
