# Surcouche prod (SP-Deploy) — appliquée par-dessus docker-compose.yml :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Différences avec le compose de dev : images depuis GHCR (au lieu de
# `build:`), tunnel sortant (aucun port hôte publié), Traefik sans ACME (le
# TLS est terminé au bord du tunnel — cf. service `tunnel`, Task 5), nom
# d'hôte public unique `GEOSTUDIO_PUBLIC_HOST` (cf. Task 3).
#
# Correctif (décision Tanguy) : chaque service substitué ci-dessous porte
# aussi `build: !reset null`. La fusion Compose est additive, pas
# remplaçante : sans ce reset, le `build:` du fichier de base survit à côté
# de l'`image:` de cet overlay dans la configuration résolue, et un hôte de
# production sans l'arbre source échoue dès qu'un build est déclenché —
# exactement ce que cet overlay a pour but d'empêcher.

volumes:
  tailscale-state:
  backup-archives:

services:

  postgis:
    image: ghcr.io/tlenenao/geostudio-postgis:${GEOSTUDIO_VERSION:-latest}
    build: !reset null
    restart: unless-stopped

  pgbouncer:
    restart: unless-stopped

  minio:
    restart: unless-stopped
    ports: !reset []

  martin:
    restart: unless-stopped
    ports: !reset []
    # Plus de route publique depuis SP-24 : Martin se connecte en propriétaire
    # des tables (donc hors RLS) et n'a aucune notion de collection ni de
    # can(). Les tuiles vectorielles d'une collection passent désormais par
    # GET /collections/{id}/tiles/{z}/{x}/{y}.mvt, servi par le cœur. Le
    # service reste joignable sur le réseau interne.
    #
    # /admin/martin (ce plan) reste une exception délibérée : connexion
    # directe d'un outil desktop (QGIS) par un admin authentifié, en toute
    # connaissance du bypass RLS — pas une réouverture de la route
    # applicative retirée par SP-24.
    #
    # labels: !override (pas une simple fusion) : le fichier de base
    # (Task 4) porte déjà entrypoints=websecure +
    # tls.certresolver=letsencrypt sur ce routeur. Compose fusionne les
    # labels comme une map par clé — sans !override, entrypoints=web
    # écraserait bien la clé entrypoints, mais tls.certresolver=letsencrypt
    # survivrait à côté (vérifié empiriquement avec `docker compose config`
    # sur un cas réduit) : un routeur sur l'entrypoint web qui tente quand
    # même une résolution ACME. !override remplace la map entière.
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.martin.rule=Host(`${GEOSTUDIO_PUBLIC_HOST}`) && PathPrefix(`/admin/martin`)
      - traefik.http.routers.martin.entrypoints=web
      - traefik.http.routers.martin.priority=15
      - traefik.http.routers.martin.middlewares=admin-auth@docker,security-headers@docker,rate-limit@docker,strip-admin-martin@docker
      - traefik.http.middlewares.strip-admin-martin.stripprefix.prefixes=/admin/martin
      - traefik.http.middlewares.admin-auth.forwardauth.address=http://core:8200/admin-tools/verify
      - traefik.http.services.martin.loadbalancer.server.port=3000

  titiler:
    restart: unless-stopped
    ports: !reset []
    # labels: !override — même raison que martin ci-dessus (le fichier de
    # base porte déjà entrypoints=websecure + tls.certresolver=letsencrypt
    # sur ce routeur ; une fusion par clé laisserait tls.certresolver
    # survivre à côté d'entrypoints=web).
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.titiler.rule=Host(`${GEOSTUDIO_PUBLIC_HOST}`) && PathPrefix(`/admin/titiler`)
      - traefik.http.routers.titiler.entrypoints=web
      - traefik.http.routers.titiler.priority=15
      - traefik.http.routers.titiler.middlewares=admin-auth@docker,security-headers@docker,rate-limit@docker,strip-admin-titiler@docker
      - traefik.http.middlewares.strip-admin-titiler.stripprefix.prefixes=/admin/titiler
      - traefik.http.services.titiler.loadbalancer.server.port=8000

  keycloak:
    restart: unless-stopped
    ports: !reset []
    environment:
      GEOSTUDIO_PUBLIC_HOST: ${GEOSTUDIO_PUBLIC_HOST}
      KC_HOSTNAME: https://${GEOSTUDIO_PUBLIC_HOST}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
    entrypoint: ["sh", "-c"]
    command:
      - >
        mkdir -p /opt/keycloak/data/import &&
        sed 's#http://localhost:8300#https://'"$$GEOSTUDIO_PUBLIC_HOST"'#g'
        /opt/keycloak/data/import-src/geostudio-realm.json
        > /opt/keycloak/data/import/geostudio-realm.json &&
        exec /opt/keycloak/bin/kc.sh start --http-enabled=true --import-realm
    volumes: !override
      - keycloak-data:/opt/keycloak/data
      - ./deploy/keycloak/geostudio-realm.json:/opt/keycloak/data/import-src/geostudio-realm.json:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.keycloak.rule=Host(`${GEOSTUDIO_PUBLIC_HOST}`) && PathPrefix(`/auth`)
      - traefik.http.routers.keycloak.entrypoints=web
      - traefik.http.routers.keycloak.priority=20
      - traefik.http.routers.keycloak.middlewares=security-headers@docker,rate-limit@docker
      - traefik.http.services.keycloak.loadbalancer.server.port=8080
    # KC_HTTP_RELATIVE_PATH=/auth déplace tout le service HTTP de Keycloak
    # (y compris /health/ready) sous /auth ; le healthcheck de base
    # (docker-compose.yml) sonde la racine et rapporte donc "unhealthy" en
    # permanence malgré un Keycloak fonctionnel (défaut trouvé en Task 6).
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /auth/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  otel-lgtm:
    restart: unless-stopped
    ports: !reset []
    # Le fichier de base (Task 4) porte déjà GF_SERVER_ROOT_URL (avec
    # ${DOMAIN}, pas ${GEOSTUDIO_PUBLIC_HOST}) sur ce service : l'override
    # ci-dessous remplace juste cette clé, GF_SERVER_SERVE_FROM_SUB_PATH
    # (base) reste hérité tel quel — une fusion de map par clé, pas de
    # !override nécessaire pour environment:.
    environment:
      GF_SERVER_ROOT_URL: https://${GEOSTUDIO_PUBLIC_HOST}/admin/grafana/
    # labels: !override — le fichier de base porte déjà
    # entrypoints=websecure + tls.certresolver=letsencrypt sur ce routeur ;
    # même raison que martin/titiler ci-dessus (vérifié empiriquement avec
    # `docker compose config` : sans !override, tls.certresolver survivrait
    # à côté d'entrypoints=web).
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`${GEOSTUDIO_PUBLIC_HOST}`) && PathPrefix(`/admin/grafana`)
      - traefik.http.routers.grafana.entrypoints=web
      - traefik.http.routers.grafana.priority=15
      - traefik.http.routers.grafana.middlewares=admin-auth@docker,security-headers@docker,rate-limit@docker
      - traefik.http.services.grafana.loadbalancer.server.port=3000

  core:
    image: ghcr.io/tlenenao/geostudio-core:${GEOSTUDIO_VERSION:-latest}
    build: !reset null
    ports: !reset []
    environment:
      CORE_AUTH_MODE: oidc
      CORE_OIDC_ISSUER: https://${GEOSTUDIO_PUBLIC_HOST}/auth/realms/geostudio
      CORE_OIDC_JWKS_URL: http://keycloak:8080/auth/realms/geostudio/protocol/openid-connect/certs
      CORE_BASE_URL: https://${GEOSTUDIO_PUBLIC_HOST}/api
      # Rappelé explicitement ici : c'est cet overlay qui donne à
      # CORE_BASE_URL une valeur que le conteneur ne peut pas s'appeler
      # lui-même (TLS + hôte public). Le rappel /mcp du copilote (SP-20)
      # doit rester local au process.
      CORE_INTERNAL_BASE_URL: http://localhost:8200
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.core.rule=Host(`${GEOSTUDIO_PUBLIC_HOST}`) && PathPrefix(`/api`)
      - traefik.http.routers.core.entrypoints=web
      - traefik.http.routers.core.priority=10
      - traefik.http.routers.core.middlewares=security-headers@docker,rate-limit@docker,compress@docker,strip-api@docker
      - traefik.http.services.core.loadbalancer.server.port=8200
      - traefik.http.middlewares.strip-api.stripprefix.prefixes=/api
      - traefik.http.middlewares.security-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.security-headers.headers.frameDeny=true
      - traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      # CSP en Report-Only pendant la vérification empirique (Step 3-4
      # ci-dessous) contre MapLibre/deck.gl/Keycloak/une extension tierce —
      # bascule en enforcing (Step 5) une fois confirmée (SP-26/3.3). Les
      # valeurs ${GEOSTUDIO_PUBLIC_HOST}/keycloak reprennent les mêmes
      # variables que le reste de ce fichier.
      #
      # 4 blocages concrets à vérifier/autoriser AVANT bascule en enforcing
      # (revue finale SP-26, I5), invisibles en Report-Only hors rapport de
      # violation : (1) `img-src` bloque les tuiles raster WMS/WMTS
      # moissonnées et le terrain raster-dem externes (hôte arbitraire par
      # conception) ; (2) `connect-src` bloque les URL de tileset 3D
      # externes (couche `tiles3d`, même raison) ; (3) `script-src 'self'`
      # bloque les widgets d'extension tiers (SP-8c, JS depuis leur propre
      # origine) ; (4) `shell/nginx.conf`'s `connect-src 'self'` est FAUX
      # pour le compose de BASE (hors cet overlay) où `shell`/`core` sont
      # deux origines distinctes — déjà correct ICI (Traefik prime, `core`
      # same-origin `/api`), à corriger là-bas avant enforcing.
      - "traefik.http.middlewares.security-headers.headers.customResponseHeaders.Content-Security-Policy-Report-Only=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://${GEOSTUDIO_PUBLIC_HOST}; img-src 'self' data: blob: https://${GEOSTUDIO_PUBLIC_HOST}; worker-src 'self' blob:; frame-src https://${GEOSTUDIO_PUBLIC_HOST}; object-src 'none'"
      - traefik.http.middlewares.security-headers.headers.customResponseHeaders.Permissions-Policy=camera=(), microphone=(), payment=(), usb=()
      - traefik.http.middlewares.rate-limit.ratelimit.average=100
      - traefik.http.middlewares.rate-limit.ratelimit.burst=200
      - traefik.http.middlewares.compress.compress=true

  # worker/cdc-worker sont la MÊME image que core (docker-compose.yml:
  # `build: ./core` pour les trois, processus séparés par `command:`) —
  # release.yml ne construit que core/shell/postgis (matrice
  # build-and-push), donc ces deux services réutilisent geostudio-core.
  worker:
    image: ghcr.io/tlenenao/geostudio-core:${GEOSTUDIO_VERSION:-latest}
    build: !reset null

  cdc-worker:
    image: ghcr.io/tlenenao/geostudio-core:${GEOSTUDIO_VERSION:-latest}
    build: !reset null

  # SP-21 : ces trois services restaient en `build:` (fichier de base), donc
  # non déployables sans compiler sur l'hôte. Leurs `profiles:` restent ceux
  # du fichier de base — substituer l'image n'allume aucune capacité.
  export-worker:
    image: ghcr.io/tlenenao/geostudio-export-worker:${GEOSTUDIO_VERSION:-latest}
    build: !reset null

  qgis-worker:
    image: ghcr.io/tlenenao/geostudio-qgis-worker:${GEOSTUDIO_VERSION:-latest}
    build: !reset null

  appexport-runtime-builder:
    image: ghcr.io/tlenenao/geostudio-appexport-runtime-builder:${GEOSTUDIO_VERSION:-latest}
    build: !reset null

  shell:
    image: ghcr.io/tlenenao/geostudio-shell:${GEOSTUDIO_VERSION:-latest}
    build: !reset null
    ports: !reset []
    environment:
      VITE_CORE_URL: https://${GEOSTUDIO_PUBLIC_HOST}/api
      VITE_OIDC_AUTHORITY: https://${GEOSTUDIO_PUBLIC_HOST}/auth/realms/geostudio
      VITE_OIDC_CLIENT_ID: geostudio-shell
      VITE_OIDC_REDIRECT_URI: https://${GEOSTUDIO_PUBLIC_HOST}/
      VITE_AUTH_MODE: oidc
    labels: !override
      - traefik.enable=true
      - traefik.http.routers.shell.rule=Host(`${GEOSTUDIO_PUBLIC_HOST}`)
      - traefik.http.routers.shell.entrypoints=web
      - traefik.http.routers.shell.priority=1
      - traefik.http.routers.shell.middlewares=security-headers@docker,rate-limit@docker,compress@docker
      - traefik.http.services.shell.loadbalancer.server.port=8300

  traefik:
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports: !reset []
    volumes: !override
      - /var/run/docker.sock:/var/run/docker.sock:ro

  tunnel:
    image: tailscale/tailscale:v1.102.3
    restart: unless-stopped
    network_mode: service:traefik
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_HOSTNAME: geostudio
    volumes:
      - tailscale-state:/var/lib/tailscale
    depends_on:
      traefik:
        condition: service_started

  backup:
    # SP-21 : `backup` n'existe que dans cet overlay et était le seul service
    # de production encore construit sur place — le mécanisme censé être le
    # dernier rempart contre la perte de données.
    image: ghcr.io/tlenenao/geostudio-backup:${GEOSTUDIO_VERSION:-latest}
    restart: unless-stopped
    environment:
      PG_PASSWORD: ${PG_PASSWORD}
      MINIO_USER: ${MINIO_USER}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      S3_THUMBNAILS_BUCKET: geostudio-thumbnails
      S3_UPLOADS_BUCKET: geostudio-uploads
      S3_CDC_BUCKET: geostudio-cdc
      S3_TILESET3D_BUCKET: geostudio-tileset3d
      S3_MAPICONS_BUCKET: geostudio-mapicons
      S3_ATTACHMENTS_BUCKET: geostudio-attachments
      S3_TERRAIN3D_BUCKET: geostudio-terrain3d
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_PASSWORD}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-geostudio-backups}
    volumes:
      - backup-archives:/backup/archives
    networks: [gis-net]
    depends_on:
      postgis:
        condition: service_healthy
      minio:
        condition: service_healthy
      keycloak:
        condition: service_healthy
