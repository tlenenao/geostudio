listen_addresses: '0.0.0.0:3000'
keep_alive: 75
worker_processes: 4

cache:
  redis:
    url: redis://redis:6379/0
    ttl: 3600
    max_size: 536870912  # 512 MB

postgres:
  connection_string: ${DATABASE_URL}
  pool_size: 20
  default_srid: 4326

