version: 2
updates:
  # Cœur Python (PEP 621, core/pyproject.toml + core/uv.lock).
  # "uv" est un package-ecosystem supporté nativement par Dependabot (il respecte
  # le lockfile uv.lock, contrairement à "pip") — mais l'option `groups.*.dependency-type`
  # n'est PAS supportée pour cet écosystème (doc GitHub : seulement bundler, composer,
  # mix, maven, npm, pip). Une config invalide y est silencieusement ignorée par
  # GitHub, donc pas de groupement dev/prod ici pour rester réellement actif.
  #
  # `target-branch: "dev"` sur les trois entrées ci-dessous : la branche par
  # défaut du dépôt est `main`, mais CLAUDE.md fixe `dev` comme branche de
  # travail — `main` ne reçoit que des merges stables. Sans ce champ,
  # Dependabot ouvrirait ses PR hebdomadaires directement sur `main`, la
  # faisant dériver en avance de `dev` (dépendances/lockfiles mis à jour d'un
  # côté et pas de l'autre) et posant des conflits de lockfile au prochain
  # merge `dev`→`main`.
  - package-ecosystem: "uv"
    directory: "/core"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # Front-end shell (package.json + package-lock.json).
  # "npm" supporte dependency-type dans groups : groupement dev/prod conservé.
  - package-ecosystem: "npm"
    directory: "/shell"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      shell-dev-dependencies:
        dependency-type: "development"
      shell-production-dependencies:
        dependency-type: "production"

  # Workflows GitHub Actions (.github/workflows/) — actions épinglées par SHA (P27.10) ; Dependabot réécrit SHA + commentaire de version.
  # Un seul emplacement dans ce dépôt,
  # pas d'actions composites réutilisables ailleurs.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # P27.11 (c06-009) : images de base des Dockerfile (tags flottants python/
  # node/nginx/alpine/debian) — jusqu'ici sans surveillance, node:20 est
  # resté en service après sa fin de vie. `directories` (pas `directory`)
  # pour couvrir tous les Dockerfile du dépôt en une entrée.
  - package-ecosystem: "docker"
    directories:
      - "/core"
      - "/shell"
      - "/deploy/appexport-runtime-builder"
      - "/deploy/appexport-standalone"
      - "/deploy/backup"
      - "/deploy/export-worker"
      - "/deploy/minio"
      - "/deploy/postgis"
      - "/deploy/titiler"
    target-branch: "dev"
    schedule:
      interval: "weekly"
