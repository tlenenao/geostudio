# Évite le 429 « toomanyrequests » de Docker Hub (pulls anonymes depuis les
# runners GitHub partagés) : le démon passe par le miroir public de Google pour
# les images docker.io, avec repli automatique sur Docker Hub si l'image manque.
name: docker-mirror
description: Configure mirror.gcr.io comme registry-mirror du démon Docker
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo '{"registry-mirrors":["https://mirror.gcr.io"]}' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
        docker info --format '{{.RegistryConfig.Mirrors}}'
