name: desktop-etl WebDriver E2E

on:
  workflow_dispatch: {}
  push:
    paths:
      - "desktop-etl/**"
      - "shell/src/desktop/**"
      - "shell/src/builder/pipeline/**"
      - "core/app/pipelines/**"
      - "core/scripts/pipeline_sidecar*.py"
      - ".github/workflows/desktop-etl-webdriver.yml"

jobs:
  e2e-windows:
    # PAS windows-latest : résout aujourd'hui vers windows-2025-vs2026, dont
    # le WebView2 Runtime casse sous automatisation WebDriver ("DevToolsActivePort
    # file doesn't exist" à chaque session, confirmé par une CI réelle sur ce
    # dépôt, Tâche 8) — régression connue de l'image, pas de ce projet
    # (github.com/actions/runner-images/issues/14738, ouverte, sans date de
    # correctif annoncée). windows-2022 (WebView2 131.x) n'a pas ce défaut.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Freeze sidecar
        working-directory: core
        shell: bash
        # Même recette que desktop-etl-sidecar-freeze.yml (lue depuis
        # pipeline_sidecar.pyinstaller-args.txt, pas dupliquée en dur ici)
        # pour ne jamais diverger si cette recette gagne un nouveau
        # --collect-all (cf. le commentaire de ce fichier).
        run: |
          uv sync
          extra_args=$(grep -v '^#' scripts/pipeline_sidecar.pyinstaller-args.txt | tr '\n' ' ')
          uv run pyinstaller --onefile --name pipeline-sidecar --paths . $extra_args scripts/pipeline_sidecar.py
      - name: Prepare sidecar binary
        run: node desktop-etl/scripts/prepare-sidecar-binary.mjs core/dist/pipeline-sidecar.exe
      - name: install msedgedriver
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Build shell desktop runtime
        working-directory: shell
        run: |
          npm ci
          npm run build:desktop-runtime
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: WebdriverIO
        working-directory: desktop-etl/e2e
        run: |
          npm ci
          npm test
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure-diagnostics
          path: desktop-etl/e2e/diagnostics
          if-no-files-found: ignore
          retention-days: 7
