name: gitleaks

on:
  push:
    branches: [main, dev]
  pull_request:

# Ne pas ajouter `schedule:` ni `workflow_dispatch:` ici sans y repenser.
# Le sous-commande `dir` utilisée ci-dessous ne bascule *jamais* elle-même
# sur un scan d'historique — elle ignore même la présence d'un `.git`. Le
# piège est humain, pas mécanique : un audit périodique (schedule) ou à la
# demande (workflow_dispatch) invite naturellement à vouloir couvrir *tout*
# l'historique plutôt que de rescanner le même arbre de travail déjà passé
# au tamis à chaque push — c'est-à-dire à remplacer `dir .` par la
# sous-commande `git .` (scan de commits). Or l'historique public de ce
# dépôt contient une vraie clé privée `age` de test au commit `0b4733a`
# (redactée depuis par `fac2606`, absente de HEAD, mais toujours présente
# dans l'historique) : un tel scan d'historique la retrouverait et
# bloquerait *tout* run tant qu'elle n'a pas été explicitement allowlistée
# ou que l'historique n'a pas été réécrit. À arbitrer explicitement
# (allowlist par SHA de commit, ou réécriture d'historique) avant d'ajouter
# un déclencheur périodique qui scannerait l'historique — jamais par
# défaut, et surtout jamais en silence en changeant juste la sous-commande.

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # `fetch-depth: 0` (historique complet) n'est plus nécessaire : le
      # scan ci-dessous porte sur l'arbre de travail du checkout (les
      # fichiers tels qu'ils existent à ce commit), jamais sur `git log` —
      # un clone superficiel (profondeur par défaut) suffit et clone moins
      # de données à chaque run.
      - uses: actions/checkout@v4

      # Décision de planification n°6 : scanner l'arbre de travail, pas
      # l'historique — cf. docs/superpowers/plans/2026-08-20-sp22-filet-
      # qualite-statique.md. La Task 7 d'origine avait implémenté ceci via
      # `gitleaks/gitleaks-action@v3`, en croyant (à tort, jamais vérifié
      # contre la source de l'action) que `GITLEAKS_NO_GIT` bornait le scan
      # à l'arbre de travail. En réalité cette variable n'existe pas côté
      # action, qui dérive toujours sa plage de scan des métadonnées
      # d'événement GitHub plutôt que d'un vrai scan de fichiers :
      # - sur `pull_request`, `ScanPullRequest` appelle
      #   `GET /repos/{owner}/{repo}/pulls/{n}/commits` sans pagination
      #   (30 résultats par page côté API) et prend commits[0]/commits[last]
      #   comme bornes base/head ;
      # - sur `push`, elle se fie au tableau `commits` du payload webhook,
      #   plafonné par GitHub à 20 entrées.
      # Mesuré sur ce dépôt : la PR #75 comptait 59 commits, #74 30, #69 33 —
      # sur la dernière PR de release, environ la moitié des commits
      # n'étaient donc jamais scannés, et le job passait quand même au vert.
      # Remède : invoquer le CLI gitleaks directement en mode `dir` (scan de
      # fichiers, aucune notion de plage de commits, donc aucune limite de
      # pagination possible par construction) sur le checkout — ce que la
      # décision n°6 demandait dès le départ. Version épinglée par le tag
      # d'image Docker (source de vérité unique, plus robuste que l'ancienne
      # variable d'environnement `GITLEAKS_VERSION` qui ne protégeait que
      # tant que l'action daignait la lire) : v8.30.1, seule version
      # vérifiée compatible avec le format `[[allowlists]]` (pluriel) de
      # `.gitleaks.toml` (le défaut de l'ancienne action, 8.24.3, l'ignore
      # silencieusement et re-signale les 19 faux positifs déjà triés en
      # Task 7). `dir .` avec `--redact` (miroir de l'ancien
      # `GITLEAKS_ENABLE_COMMENTS: "false"` — jamais de secret en clair dans
      # les logs), `.gitleaks.toml` auto-détecté à la racine du répertoire
      # scanné (aucun `--config` explicite requis). Le code de sortie par
      # défaut du CLI est déjà 1 sur détection — pas de `--exit-code`
      # explicite nécessaire pour bloquer, mais posé ici pour ne pas
      # dépendre d'un défaut non documenté dans ce fichier.
      - name: gitleaks (scan de l'arbre de travail)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 \
            dir . --redact --exit-code 1
