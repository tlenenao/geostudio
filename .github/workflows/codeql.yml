name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Deux langages seulement : le cœur (Python) et le shell (JS/TS).
        # Tous deux interprétés, donc `build-mode: none` — pas d'étape de
        # build à ajouter.
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Restreint l'analyse au code applicatif : `docs/` embarque un
          # rapport HTML généré qui porte son propre JavaScript, hors du
          # périmètre annoncé ci-dessus. Détail et justification dans le
          # fichier lui-même. `paths-ignore` n'a d'effet que pour les
          # langages interprétés — c'est exactement notre cas (build-mode:
          # none sur les deux).
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"
