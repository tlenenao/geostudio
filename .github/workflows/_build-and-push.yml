name: Build and push images (reusable)

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Tag principal à publier (ex. v0.1.0, ou edge)"
        required: true
        type: string
      also_tag_latest:
        description: "Publier aussi sous :latest (réservé aux vraies releases)"
        required: false
        type: boolean
        default: false
      run_scans:
        description: "Exécuter Trivy + SBOM (coûteux, réservé aux vraies releases)"
        required: false
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      # Sans ceci, un échec sur une seule des neuf legs (par ex. disque ou
      # timeout sur geostudio-qgis-worker, 11.1 Go, ou geostudio-export-worker,
      # 3.14 Go) annule les huit autres avant publication — dont core/shell/
      # postgis, qui n'ont eux-mêmes aucune raison d'échouer.
      fail-fast: false
      matrix:
        include:
          - image: geostudio-core
            context: ./core
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: geostudio-shell
            context: ./shell
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: geostudio-postgis
            context: ./deploy/postgis
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: geostudio-titiler
            context: ./deploy/titiler
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: geostudio-appexport-standalone
            context: .
            dockerfile: deploy/appexport-standalone/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: geostudio-export-worker
            context: ./core
            dockerfile: ../deploy/export-worker/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: geostudio-qgis-worker
            context: ./deploy/qgis-worker
            dockerfile: Dockerfile
            # Base qgis/qgis:release-3_34 mono-arch (probable amd64 seul),
            # image 11 Go — hors périmètre du portage arm64.
            platforms: linux/amd64
          - image: geostudio-appexport-runtime-builder
            context: .
            dockerfile: deploy/appexport-runtime-builder/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: geostudio-backup
            context: ./deploy/backup
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        shell: bash
        env:
          # Interpolation dans `env:` plutôt que directement dans `run:` —
          # une valeur de matrice/input contenant `$(...)` interpolée en
          # dur dans le script serait exécutée avant même que bash ne le
          # lise (revue finale, M1 ; risque faible ici, ces valeurs sont
          # figées dans ce fichier, mais patron plus sûr par défaut).
          IMAGE: ${{ matrix.image }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ALSO_TAG_LATEST: ${{ inputs.also_tag_latest }}
        run: |
          tags="ghcr.io/tlenenao/${IMAGE}:${IMAGE_TAG}"
          if [ "$ALSO_TAG_LATEST" = "true" ]; then
            tags="${tags}
          ghcr.io/tlenenao/${IMAGE}:latest"
          fi
          {
            echo "tags<<GEOSTUDIO_TAGS_EOF"
            echo "$tags"
            echo "GEOSTUDIO_TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      # Report-only : exit-code 0 quel que soit le résultat, ce scan ne
      # bloque jamais la publication. Réservé aux vraies releases
      # (run_scans) — coûteux à répéter sur les 9 images à chaque merge sur
      # main, alors qu'un tag `edge` est déjà remplacé au merge suivant.
      # Épinglé à la version exacte publiée par Aqua Security plutôt qu'à
      # `@master` (référence flottante) — `aquasecurity/trivy-action` a été
      # ciblée par une attaque de la chaîne d'approvisionnement (cf. notes
      # de la release v0.35.0), dont les mainteneurs se sont protégés
      # depuis via les releases GitHub immuables (vérifié : v0.36.0 est
      # marquée `immutable`, son tag ne peut donc plus être déplacé après
      # coup). Cette étape et SBOM sont informationnelles — une défaillance
      # d'infrastructure (perte réseau en re-téléchargeant une image 11 Go,
      # limite de taux GHCR) ne doit jamais rendre la publication red.
      - name: Trivy (report-only)
        if: inputs.run_scans
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/tlenenao/${{ matrix.image }}:${{ inputs.image_tag }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      # SP-22, résidu de revue : un `continue-on-error: true` ici tolérait
      # *tout* échec, y compris un vrai rejet SARIF (403, catégorie
      # invalide) que l'on veut voir — ces étapes n'ont encore jamais tourné
      # pour de vrai, leur première exécution réelle est donc aussi leur
      # premier test. Remplacé par un garde précis plutôt qu'un filet
      # large : l'étape est sautée (pas « passée en échouant ») quand Trivy
      # n'a produit aucun fichier SARIF (panne d'infra à l'étape
      # précédente, déjà absorbée par son propre `continue-on-error`), mais
      # s'exécute et remonte un échec réel et visible si le SARIF existe et
      # que l'upload lui-même échoue.
      - name: Upload Trivy results
        if: inputs.run_scans && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      # `upload-artifact: true` (défaut de l'action) publie déjà le SBOM
      # comme artefact de run — nécessaire ici puisque ni `release.yml` ni
      # `publish-edge.yml` ne créent de Release GitHub à laquelle attacher
      # un fichier.
      - name: SBOM
        if: inputs.run_scans
        continue-on-error: true
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ghcr.io/tlenenao/${{ matrix.image }}:${{ inputs.image_tag }}
          artifact-name: ${{ matrix.image }}-sbom.spdx.json
          output-file: ${{ matrix.image }}-sbom.spdx.json
