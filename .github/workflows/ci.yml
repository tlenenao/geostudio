name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    env:
      DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis
    steps:
      - uses: actions/checkout@v7
      - name: Build postgis+pgvector image
        run: docker build -t geostudio-postgis-ci:latest ../deploy/postgis
      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=gis -e POSTGRES_PASSWORD=gis -e POSTGRES_DB=gis \
            -p 5432:5432 geostudio-postgis-ci:latest
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U gis && break
            sleep 2
          done
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    env:
      CORE_TEST_DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis_test
    steps:
      - uses: actions/checkout@v7
      - name: Build postgis+pgvector image
        run: docker build -t geostudio-postgis-ci:latest ../deploy/postgis
      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=gis -e POSTGRES_PASSWORD=gis -e POSTGRES_DB=gis_test \
            -p 5432:5432 geostudio-postgis-ci:latest \
            -c wal_level=logical \
            -c output_plugin_libraries=wal2json,pgoutput,test_decoding
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U gis && break
            sleep 2
          done
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict app/auth app/secrets app/analytics app/copilot app/admin_tools app/roles
      - run: uv run pytest --cov=app --cov-report=xml:coverage.xml
      - run: uv run python scripts/check_coverage.py coverage.xml .coverage-threshold
      - uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: core/coverage.xml
      - name: Mypy (périmètre large, non bloquant)
        run: uv run mypy app/ || true
      - run: uv run lint-imports

  # Les 5 tests @pytest.mark.qgis exigent un vrai sidecar qgis-worker et un
  # /scratch partagé avec lui. Faute de ce câblage, ils skippaient
  # silencieusement en CI depuis SP-15d (2026-08-06) — SP-44 les a exécutés
  # une fois à la main (2 bugs de production réels trouvés à cette
  # occasion), mais laissait le câblage CI hors périmètre. Job séparé, et
  # non une étape du job `core` : l'image de base QGIS pèse 11 Go, la faire
  # peser sur le job principal rallongerait chaque exécution de CI.
  core-qgis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    env:
      CORE_TEST_DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis_test
      CORE_TEST_QGIS_WORKER_URL: http://localhost:8300
      # Chemin ABSOLU et identique des deux côtés du montage : le process
      # pytest écrit le .gpkg d'entrée depuis le runner, le sidecar le relit
      # depuis son conteneur au même chemin. app/pipelines/runtime.py code
      # « /scratch » en dur (_QGIS_SCRATCH_ROOT), donc ce chemin-là n'est pas
      # libre.
      CORE_TEST_QGIS_SCRATCH_DIR: /scratch
    steps:
      - uses: actions/checkout@v7
      - name: Libérer du disque (image QGIS 11 Go)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Build postgis+pgvector image
        run: docker build -t geostudio-postgis-ci:latest ../deploy/postgis
      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=gis -e POSTGRES_PASSWORD=gis -e POSTGRES_DB=gis_test \
            -p 5432:5432 geostudio-postgis-ci:latest \
            -c wal_level=logical \
            -c output_plugin_libraries=wal2json,pgoutput,test_decoding
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U gis && break
            sleep 2
          done
      - name: Build qgis-worker image
        run: docker build -t geostudio-qgis-worker:ci ../deploy/qgis-worker
      - name: Start qgis-worker sur un /scratch partagé
        run: |
          # 0777 : le sidecar tourne en uid 1001 (qgis) et pytest sous
          # l'utilisateur du runner, dont l'uid n'est garanti par aucun
          # contrat GitHub. La recette locale (scripts/run-qgis-tests.sh)
          # préserve elle l'égalité d'uid réelle avec la production ; ici on
          # relâche les permissions plutôt que de parier dessus.
          sudo mkdir -p /scratch && sudo chmod 0777 /scratch
          docker run -d --name ci-qgis-worker \
            -e QT_QPA_PLATFORM=offscreen \
            -v /scratch:/scratch \
            -p 8300:8000 geostudio-qgis-worker:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              http://localhost:8300/run -H 'Content-Type: application/json' \
              -d '{"algorithmId":"pas-dans-l-allowlist","inputs":{}}' || true)
            # 403 = le sidecar répond ET applique son allowlist : c'est la
            # sonde de vivacité, il n'expose aucune route de santé.
            [ "$code" = "403" ] && break
            sleep 2
          done
          [ "$code" = "403" ]
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run pytest -m qgis -q

  core-deps-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run pip-audit --strict

  api-types-drift:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv sync
        working-directory: core
      - run: uv run python scripts/export_openapi.py openapi.json
        working-directory: core
        env:
          PYTHONPATH: .
          CORE_SECRETS_MASTER_KEY: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
      - run: npm ci
        working-directory: shell
      - run: npm run gen:api-types
        working-directory: shell
      - run: git diff --exit-code -- shell/src/api/generated/core-schema.d.ts

  shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test -- --coverage
      - run: node scripts/check-coverage.mjs coverage/coverage-summary.json .coverage-threshold
      - uses: actions/upload-artifact@v4
        with:
          name: shell-coverage
          path: shell/coverage/coverage-summary.json
      - run: npm run build:export-runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
      - run: node scripts/check-bundle-size.mjs dist/.vite/manifest.json .bundle-size-threshold

  shell-e2e-oidc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build postgis+pgvector image
        run: docker build -t geostudio-postgis-ci:latest deploy/postgis
      - name: Bring up postgis, keycloak, core, shell (real OIDC)
        run: |
          cat > .env <<EOF
          PG_PASSWORD=ci-postgres-password
          MINIO_USER=ci-minio-user
          MINIO_PASSWORD=ci-minio-password
          KC_PASSWORD=ci-keycloak-password
          CORE_AUTH_MODE=oidc
          CORE_SECRETS_MASTER_KEY=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          VITE_OIDC_AUTHORITY=http://localhost:8180/realms/geostudio
          VITE_OIDC_CLIENT_ID=geostudio-shell
          VITE_OIDC_REDIRECT_URI=http://localhost:8300/
          VITE_AUTH_MODE=oidc
          EOF
          docker compose build core shell
          docker compose up -d postgis keycloak core shell
      - name: Wait for shell to be reachable
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8300/ > /dev/null && break
            sleep 5
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: shell
      - run: npx playwright install --with-deps chromium
        working-directory: shell
      - run: npm run e2e:oidc
        working-directory: shell
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs core keycloak shell

  shell-deps-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm audit --audit-level=high --json > npm-audit.json || true
      - run: node scripts/check-npm-audit.mjs npm-audit.json

  feature-health:
    runs-on: ubuntu-latest
    needs: [core, shell]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v4
        with: {name: core-coverage, path: core}
      - uses: actions/download-artifact@v4
        with: {name: shell-coverage, path: shell/coverage}
      - run: uv sync
        working-directory: core
      - run: uv run python scripts/feature_health_cli.py --repo .. --check
        working-directory: core
        env:
          PYTHONPATH: .

  commitlint:
    # REV-070 : miroir CI du hook local `commitlint` (commit-msg,
    # .pre-commit-config.yaml) — aucune porte automatisée n'existait
    # jusqu'ici pour un message de commit non conventionnel fusionné sans
    # être passé par le hook local (ex. via l'UI GitHub). Ne tourne que sur
    # pull_request : `github.event.pull_request.{base,head}.sha` n'existe
    # pas sur push, et ce sont ces deux champs du payload d'événement —
    # jamais une plage recalculée via l'API paginée `GET .../pulls/{n}/commits`
    # — qui donnent une plage de commits exacte, sans la limite de
    # pagination qui a déjà mordu ce dépôt une fois (cf. commentaire de
    # gitleaks.yml, PR #75 : 59 commits, seule la moitié scannée par
    # l'ancienne gitleaks-action v3 qui dérivait sa plage via cette même
    # API). `fetch-depth: 0` (historique complet) est nécessaire ici,
    # contrairement à gitleaks.yml qui scanne l'arbre de travail et n'a
    # besoin d'aucun historique : commitlint doit relire chaque commit de
    # la plage.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: shell
      - name: commitlint (plage de commits de la PR)
        run: npx --prefix shell commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
