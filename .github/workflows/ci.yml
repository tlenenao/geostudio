name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# P27.13 : un nouveau push sur une PR annule les runs obsolètes ; jamais sur
# push (dev/main) — chaque commit y garde son verdict complet.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    env:
      DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build postgis+pgvector image
        run: docker build -t geostudio-postgis-ci:latest ../deploy/postgis
      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=gis -e POSTGRES_PASSWORD=gis -e POSTGRES_DB=gis \
            -p 5432:5432 geostudio-postgis-ci:latest
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U gis && break
            sleep 2
          done
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: core
    env:
      CORE_TEST_DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis_test
      # P27.01 : base réelle obligatoire en CI — sans elle les tests postgis
      # échouent au lieu de skipper en vert (core/tests/conftest.py).
      CORE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build postgis+pgvector image
        run: docker build -t geostudio-postgis-ci:latest ../deploy/postgis
      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=gis -e POSTGRES_PASSWORD=gis -e POSTGRES_DB=gis_test \
            -p 5432:5432 geostudio-postgis-ci:latest \
            -c wal_level=logical \
            -c output_plugin_libraries=wal2json,pgoutput,test_decoding
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U gis && break
            sleep 2
          done
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict app/auth app/secrets app/analytics app/copilot app/admin_tools app/roles app/net_pin.py
      - run: uv run pytest --cov=app --cov-report=xml:coverage.xml
      # P27.09 : retention.py (rotation des sauvegardes) vit hors de
      # `testpaths = ["tests"]` — sans cette ligne, aucun job ne le garde.
      - run: uv run pytest --no-cov ../deploy/backup/test_retention.py
      - run: uv run python scripts/check_coverage.py coverage.xml .coverage-threshold
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-coverage
          path: core/coverage.xml
      - name: Mypy (périmètre large, non bloquant)
        run: uv run mypy app/ || true
      - run: uv run lint-imports

  # A20 (feuille de route §8) promet une conformité STAC « vérifiée par
  # stac-api-validator en CI » — jamais mis en place jusqu'ici (SP-12a avait
  # tranché pour un smoke non bloquant faute de temps, REV-098/GAP-04).
  # Démarre un vrai process `core` (mock auth, sans Traefik/Keycloak/MinIO —
  # aucun des trois n'est nécessaire pour le seul chemin de lecture STAC) et
  # l'interroge avec l'outil réel plutôt qu'un smoke test maison.
  #
  # Conformité vérifiée pour de vrai (uvx --from stac-api-validator, version
  # verrouillée par ../uv.lock — piège CLAUDE.md n°3 : la syntaxe CLI a été
  # relue depuis le --help réel de l'outil, jamais supposée) :
  #   - core/collections/features : bloquant, premier passage propre après
  #     2 correctifs légers (2026-09-06) — landing page sans lien
  #     service-desc/service-doc (ajoutés, app/stac/serializers.py) et les 4
  #     endpoints GeoJSON répondaient en application/json au lieu
  #     d'application/geo+json (GeoJSONResponse dédiée, app/stac/routes.py).
  #   - item-search : NON bloquant (continue-on-error) — le premier passage
  #     réel a trouvé ~25 erreurs de conformité réelles et non triviales,
  #     pas des faux positifs : validation RFC 3339 de `datetime` bien plus
  #     laxiste que le spec STAC (accepte des formats invalides, renvoie 500
  #     au lieu de 400 sur plusieurs entrées malformées), `bbox` n'est pas
  #     validé (lat1>lat2 accepté), `limit` négatif renvoie 422 (Pydantic)
  #     au lieu de 400, bbox+intersects combinés ensemble sans rejet. Fermer
  #     ça est un chantier à part entière (réécriture de _parse_dt/
  #     _collection_in_datetime/_parse_bbox dans app/stac/routes.py) — hors
  #     périmètre de ce câblage CI. Le job reste vert (erreurs visibles dans
  #     les logs, jamais bloquantes) jusqu'à ce chantier ; à repasser en
  #     bloquant une fois fermé.
  stac-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    env:
      DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis_stac
      CORE_AUTH_MODE: mock
      CORE_ENV: development
      CORE_SECRETS_MASTER_KEY: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build postgis+pgvector image
        run: docker build -t geostudio-postgis-ci:latest ../deploy/postgis
      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=gis -e POSTGRES_PASSWORD=gis -e POSTGRES_DB=gis_stac \
            -p 5432:5432 geostudio-postgis-ci:latest
          for _ in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U gis && break
            sleep 2
          done
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync
      - run: uv run alembic upgrade head
      - name: Créer une table physique et une collection STAC de démonstration
        run: |
          docker exec ci-postgres psql -U gis -d gis_stac -c "
            CREATE TABLE stac_ci_demo (id serial PRIMARY KEY, name text, geom geometry(Point, 4326));
            INSERT INTO stac_ci_demo (name, geom) VALUES
              ('a', ST_SetSRID(ST_MakePoint(1.0, 44.0), 4326)),
              ('b', ST_SetSRID(ST_MakePoint(2.0, 45.0), 4326)),
              ('c', ST_SetSRID(ST_MakePoint(3.0, 46.0), 4326));
          "
      - name: Démarrer core en arrière-plan (mode mock — pas de Keycloak/Traefik/MinIO)
        run: |
          nohup uv run uvicorn app.main:app --host 0.0.0.0 --port 8200 \
            > core-stac.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8200/health > /dev/null && break
            sleep 2
          done
          curl -sf http://localhost:8200/health
      - name: Enregistrer la collection publique via l'API (mode mock = admin)
        run: |
          curl -sf -X POST http://localhost:8200/v1/collections \
            -H "Authorization: Bearer ci-stac-validator" \
            -H "Content-Type: application/json" \
            -d '{"tableName":"stac_ci_demo","isPublic":true}'
      - name: stac-api-validator — core/collections/features (bloquant)
        run: |
          uvx --from stac-api-validator stac-api-validator \
            --root-url http://localhost:8200/v1/stac \
            --conformance core --conformance collections --conformance features \
            --collection stac_ci_demo
      - name: stac-api-validator — item-search (non bloquant, cf. commentaire du job)
        continue-on-error: true
        run: |
          uvx --from stac-api-validator stac-api-validator \
            --root-url http://localhost:8200/v1/stac \
            --conformance item-search \
            --collection stac_ci_demo
      - name: Logs de core en cas d'échec
        if: failure()
        run: cat core-stac.log

  core-deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync
      # PYSEC-2026-4114 (oauthlib, timing PKCE) : ne touche que la grant
      # serveur `AuthorizationCode`, jamais utilisée ici (oauthlib n'entre que
      # comme client via databricks-sql-connector, qui épingle <4). À retirer
      # dès que databricks-sql-connector accepte oauthlib>=4.
      - run: uv run pip-audit --strict --ignore-vuln PYSEC-2026-4114

  api-types-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: uv sync
        working-directory: core
      - run: uv run python scripts/export_openapi.py openapi.json
        working-directory: core
        env:
          PYTHONPATH: .
          CORE_SECRETS_MASTER_KEY: "AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8="
      - run: npm ci
        working-directory: shell
      - run: npm run gen:api-types
        working-directory: shell
      - run: git diff --exit-code -- shell/src/api/generated/core-schema.d.ts

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test -- --coverage
      - run: node scripts/check-coverage.mjs coverage/coverage-summary.json .coverage-threshold
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shell-coverage
          path: shell/coverage/coverage-summary.json
      - run: npm run build:export-runtime
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
      - run: node scripts/check-bundle-size.mjs dist/.vite/manifest.json .bundle-size-threshold

  shell-e2e-oidc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build postgis+pgvector image
        run: docker build -t geostudio-postgis-ci:latest deploy/postgis
      - name: Bring up postgis, keycloak, core, shell (real OIDC)
        run: |
          cat > .env <<EOF
          PG_PASSWORD=ci-postgres-password
          MINIO_USER=ci-minio-user
          MINIO_PASSWORD=ci-minio-password
          KC_PASSWORD=ci-keycloak-password
          CORE_AUTH_MODE=oidc
          CORE_SECRETS_MASTER_KEY=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          VITE_OIDC_AUTHORITY=http://localhost:8180/realms/geostudio
          VITE_OIDC_CLIENT_ID=geostudio-shell
          VITE_OIDC_REDIRECT_URI=http://localhost:8300/
          VITE_AUTH_MODE=oidc
          CORE_LLM_PROVIDER=fake
          EOF
          docker compose build core shell
          docker compose up -d postgis keycloak core shell
      - name: Wait for shell to be reachable
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:8300/ > /dev/null && break
            sleep 5
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: shell
      - run: npx playwright install --with-deps chromium
        working-directory: shell
      - run: npm run e2e:oidc
        working-directory: shell
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs core keycloak shell

  # P27 (critère de clôture) : stack composée minimale. Les jobs `core` (base
  # nue) et `shell` (cœur mocké) ne voient jamais l'assemblage réel — c'est ce
  # trou qui a laissé passer RC-1 (.defer() hors App procrastinate), RC-2
  # (worker non câblé), RC-3 (MinIO/secrets HMAC) et RC-4 (nginx .mjs) : tous
  # verts en CI, tous cassés en stack réelle. scripts/ci/stack-smoke.sh rejoue
  # import GeoJSON, worker MapLibre, lien de partage, run de pipeline par
  # l'API et export d'app contre les vrais conteneurs (auth mock : l'OIDC est
  # couvert par shell-e2e-oidc).
  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Écrit le .env de la stack de fumée
        run: |
          cat > .env <<EOF
          PG_PASSWORD=ci-postgres-password
          MINIO_USER=ci-minio-user
          MINIO_PASSWORD=ci-minio-password
          KC_PASSWORD=ci-keycloak-password
          CORE_AUTH_MODE=mock
          CORE_ENV=development
          CORE_SECRETS_MASTER_KEY=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          CORE_ETL_ENABLED=true
          CORE_APPEXPORT_ENABLED=true
          CORE_SHARE_LINK_TOKEN_SECRET=ci-share-link-secret-0123456789abcdef
          CORE_EXPORT_TOKEN_SECRET=ci-export-token-secret-0123456789abcdef
          S3_PUBLIC_ENDPOINT_URL=http://localhost:9000
          CORE_LLM_PROVIDER=
          EOF
      - name: Build et démarrage (core, worker, cdc-worker, shell, MinIO, PostGIS)
        run: |
          docker compose build core worker cdc-worker shell
          docker compose up -d core worker cdc-worker shell
      - name: Runtime d'export d'app (one-shot, profil appexport)
        run: docker compose --profile appexport run --rm appexport-runtime-builder
      - name: Fumée de bout en bout
        run: scripts/ci/stack-smoke.sh
      - name: Journaux des services en cas d'échec
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=200 core worker cdc-worker shell minio

  shell-deps-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high --json > npm-audit.json || true
      - run: node scripts/check-npm-audit.mjs npm-audit.json

  feature-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [core, shell]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: core-coverage, path: core}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: shell-coverage, path: shell/coverage}
      - run: uv sync
        working-directory: core
      # Les deux seuls tests de test_feature_health_coverage.py qui ont
      # besoin d'artefacts réels (core/coverage.xml + shell coverage-summary)
      # skippent dans le job `core` lui-même (l'un des deux fichiers n'y
      # existe jamais — poule/œuf ou job distinct) ; ici les deux coexistent
      # après téléchargement, donc ils s'exécutent pour de vrai.
      - run: uv run pytest tests/test_feature_health_coverage.py -q
        working-directory: core
      - run: uv run python scripts/feature_health_cli.py --repo .. --check
        working-directory: core
        env:
          PYTHONPATH: .
      # REV-288 b : mêmes planchers lus du snapshot committé (reproductible
      # hors CI, sans coverage.xml local).
      - run: uv run python scripts/feature_health_cli.py --repo .. --check-snapshot
        working-directory: core
        env:
          PYTHONPATH: .
      # Fraîcheur des rendus committés (docs/revue/bilan-fonctionnalites.*) :
      # l'ancien dispositif (commit bot sur chaque push + diff octet-à-octet
      # bloquant sur la PR) ne pouvait pas converger — le bot committait un
      # cran en retard, ses commits n'avaient pas de CI (`action_required`),
      # le journal grossissait de 308 lignes par push, et le diff sur la
      # PR dev->main échouait à chaque commit. Désormais : les planchers
      # (--check ci-dessus) restent LE garde-fou bloquant ; le bilan frais de
      # CE run est publié en artefact (toujours exact, zéro commit) ; le
      # snapshot committé est régénéré à la clôture d'un SP (CLAUDE.md) et
      # sa péremption n'est plus qu'un avertissement.
      - name: Rendus committés périmés ? (avertissement, non bloquant)
        continue-on-error: true
        run: uv run python scripts/feature_health_cli.py --repo .. --check-fresh
        working-directory: core
        env:
          PYTHONPATH: .
      - name: Génère le bilan frais de ce run
        run: uv run python scripts/feature_health_cli.py --repo .. --write
        working-directory: core
        env:
          PYTHONPATH: .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bilan-fonctionnalites
          path: |
            docs/revue/bilan-fonctionnalites.html
            docs/revue/bilan-fonctionnalites.md

  commitlint:
    # REV-070 : miroir CI du hook local `commitlint` (commit-msg,
    # .pre-commit-config.yaml) — aucune porte automatisée n'existait
    # jusqu'ici pour un message de commit non conventionnel fusionné sans
    # être passé par le hook local (ex. via l'UI GitHub). Ne tourne que sur
    # pull_request : `github.event.pull_request.{base,head}.sha` n'existe
    # pas sur push, et ce sont ces deux champs du payload d'événement —
    # jamais une plage recalculée via l'API paginée `GET .../pulls/{n}/commits`
    # — qui donnent une plage de commits exacte, sans la limite de
    # pagination qui a déjà mordu ce dépôt une fois (cf. commentaire de
    # gitleaks.yml, PR #75 : 59 commits, seule la moitié scannée par
    # l'ancienne gitleaks-action v3 qui dérivait sa plage via cette même
    # API). `fetch-depth: 0` (historique complet) est nécessaire ici,
    # contrairement à gitleaks.yml qui scanne l'arbre de travail et n'a
    # besoin d'aucun historique : commitlint doit relire chaque commit de
    # la plage.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: shell
      - name: commitlint (plage de commits de la PR)
        run: npx --prefix shell commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  claude-md-size:
    # Miroir CI du hook local `claude-md-size` (.pre-commit-config.yaml) —
    # garde-fou posé le 2026-09-17 après une dérive vécue pendant ~35 SP
    # (CLAUDE.md gonflé à 2324 lignes malgré une règle déjà écrite en prose).
    # Python stdlib seul, aucune dépendance à installer.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/check_claude_md_size.py CLAUDE.md .claude-md-size-threshold
