name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
          POSTGRES_DB: gis
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U gis" --health-interval=5s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: core
    env:
      DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base

  core:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gis
          POSTGRES_PASSWORD: gis
          POSTGRES_DB: gis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gis" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: core
    env:
      CORE_TEST_DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run pytest
      - run: uv run lint-imports

  api-types-drift:
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: uv sync
        working-directory: core
      - run: uv run python scripts/export_openapi.py openapi.json
        working-directory: core
        env:
          PYTHONPATH: .
      - run: npm ci
        working-directory: shell
      - run: npm run gen:api-types
        working-directory: shell
      - run: git diff --exit-code -- shell/src/api/generated/core-schema.d.ts
