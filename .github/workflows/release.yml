name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build postgis+pgvector image
        run: docker build -t geostudio-postgis-ci:latest ./deploy/postgis

      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=gis -e POSTGRES_PASSWORD=gis -e POSTGRES_DB=gis \
            -p 5432:5432 geostudio-postgis-ci:latest
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U gis && break
            sleep 2
          done

      - uses: astral-sh/setup-uv@v3

      - name: Migrations up/down
        working-directory: core
        env:
          DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis
        run: |
          uv sync
          uv run alembic upgrade head
          uv run alembic downgrade base

      - name: Core tests
        working-directory: core
        env:
          CORE_TEST_DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis
        run: |
          uv run pytest
          uv run lint-imports

      - name: Stop Postgres
        if: always()
        run: docker rm -f ci-postgres
        # Frees the runner's CPU/memory before the Playwright step, which
        # unlike ci.yml's isolated `shell` job shares this single runner
        # with the migrations/core steps above (test-gate merges all three
        # by design, cf. spec). An idle-but-running container left over
        # here was enough contention to make admin-collections.spec.ts's
        # final assertion (5s window for a dialog-close + refetch cycle)
        # miss deterministically, while the same test passes cleanly when
        # `shell` runs alone.

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Shell tests
        working-directory: shell
        run: |
          npm ci
          npm run test
          npx playwright install --with-deps chromium
          npm run e2e
          npm run build

  build-and-push:
    needs: test-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: geostudio-core
            context: ./core
            dockerfile: Dockerfile
          - image: geostudio-shell
            context: ./shell
            dockerfile: Dockerfile
          - image: geostudio-postgis
            context: ./deploy/postgis
            dockerfile: Dockerfile
          - image: geostudio-appexport-standalone
            context: .
            dockerfile: deploy/appexport-standalone/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/tlenenao/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/tlenenao/${{ matrix.image }}:latest
