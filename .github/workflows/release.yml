name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build postgis+pgvector image
        run: docker build -t geostudio-postgis-ci:latest ./deploy/postgis

      - name: Start Postgres
        # Les deux derniers flags doivent rester alignés sur le job `core` de
        # ci.yml : sans `wal_level=logical`, les tests `@pytest.mark.postgis`
        # du consommateur CDC (SP-11) échouent en
        # « logical decoding requires wal_level >= logical ». Cette porte de
        # release avait dérivé de la CI sans que personne ne le voie — la
        # dernière release taguée (`v0.1.0-rc1`, 2026-07-15) est antérieure à
        # ces tests, donc cette porte ne les avait jamais exécutés.
        # `test_release_gate_starts_postgres_like_ci` garde l'alignement.
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=gis -e POSTGRES_PASSWORD=gis -e POSTGRES_DB=gis \
            -p 5432:5432 geostudio-postgis-ci:latest \
            -c wal_level=logical \
            -c output_plugin_libraries=wal2json,pgoutput,test_decoding
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U gis && break
            sleep 2
          done

      - uses: astral-sh/setup-uv@v7

      - name: Migrations up/down
        working-directory: core
        env:
          DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis
        run: |
          uv sync
          uv run alembic upgrade head
          uv run alembic downgrade base

      - name: Core tests
        working-directory: core
        env:
          CORE_TEST_DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis
        run: |
          uv run pytest
          uv run lint-imports

      - name: Stop Postgres
        if: always()
        run: docker rm -f ci-postgres
        # Frees the runner's CPU/memory before the Playwright step, which
        # unlike ci.yml's isolated `shell` job shares this single runner
        # with the migrations/core steps above (test-gate merges all three
        # by design, cf. spec). An idle-but-running container left over
        # here was enough contention to make admin-collections.spec.ts's
        # final assertion (5s window for a dialog-close + refetch cycle)
        # miss deterministically, while the same test passes cleanly when
        # `shell` runs alone.

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Shell tests
        working-directory: shell
        run: |
          npm ci
          npm run test
          npx playwright install --with-deps chromium
          npm run e2e
          npm run build

  build-and-push:
    needs: test-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      # Sans ceci, un échec sur une seule des huit legs (par ex. disque ou
      # timeout sur geostudio-qgis-worker, 11.1 Go, ou geostudio-export-worker,
      # 3.14 Go) annule les sept autres avant publication — dont core/shell/
      # postgis, qui n'ont eux-mêmes aucune raison d'échouer.
      fail-fast: false
      matrix:
        include:
          - image: geostudio-core
            context: ./core
            dockerfile: Dockerfile
          - image: geostudio-shell
            context: ./shell
            dockerfile: Dockerfile
          - image: geostudio-postgis
            context: ./deploy/postgis
            dockerfile: Dockerfile
          - image: geostudio-appexport-standalone
            context: .
            dockerfile: deploy/appexport-standalone/Dockerfile
          # SP-21 : ces quatre images existaient uniquement en `build:` dans
          # le compose — donc introuvables au déploiement. `context` et
          # `dockerfile` doivent correspondre **exactement** aux valeurs du
          # compose : c'est ce couple que vérifie
          # tests/test_deployability.py::test_every_build_service_has_a_released_image.
          - image: geostudio-export-worker
            context: ./core
            dockerfile: ../deploy/export-worker/Dockerfile
          - image: geostudio-qgis-worker
            context: ./deploy/qgis-worker
            dockerfile: Dockerfile
          - image: geostudio-appexport-runtime-builder
            context: .
            dockerfile: deploy/appexport-runtime-builder/Dockerfile
          - image: geostudio-backup
            context: ./deploy/backup
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/tlenenao/${{ matrix.image }}:${{ github.ref_name }}
            ghcr.io/tlenenao/${{ matrix.image }}:latest

      # Report-only : exit-code 0 quel que soit le résultat, ce scan ne
      # bloque jamais la publication. Épinglé à la version exacte publiée
      # par Aqua Security plutôt qu'à `@master` (référence flottante) —
      # `aquasecurity/trivy-action` a été ciblée par une attaque de la
      # chaîne d'approvisionnement (cf. notes de la release v0.35.0), dont
      # les mainteneurs se sont protégés depuis via les releases GitHub
      # immuables (vérifié : v0.36.0 est marquée `immutable`, son tag ne
      # peut donc plus être déplacé après coup).
      # Ces deux étapes (Trivy et SBOM) sont informationnelles — une défaillance
      # d'infrastructure (perte réseau en re-téléchargeant une image 11 Go,
      # limite de taux GHCR) ne doit jamais rendre la publication red.
      - name: Trivy (report-only)
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/tlenenao/${{ matrix.image }}:${{ github.ref_name }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      # SP-22, résidu de revue : un `continue-on-error: true` ici tolérait
      # *tout* échec, y compris un vrai rejet SARIF (403, catégorie
      # invalide) que l'on veut voir — ces étapes n'ont encore jamais tourné
      # pour de vrai, leur première exécution réelle est donc aussi leur
      # premier test. Remplacé par un garde précis plutôt qu'un filet
      # large : l'étape est sautée (pas « passée en échouant ») quand Trivy
      # n'a produit aucun fichier SARIF (panne d'infra à l'étape
      # précédente, déjà absorbée par son propre `continue-on-error`), mais
      # s'exécute et remonte un échec réel et visible si le SARIF existe et
      # que l'upload lui-même échoue.
      - name: Upload Trivy results
        if: hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      # `upload-artifact: true` (défaut de l'action) publie déjà le SBOM
      # comme artefact de run — nécessaire ici puisque `release.yml` ne crée
      # aucune Release GitHub à laquelle attacher un fichier.
      - name: SBOM
        continue-on-error: true
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ghcr.io/tlenenao/${{ matrix.image }}:${{ github.ref_name }}
          artifact-name: ${{ matrix.image }}-sbom.spdx.json
          output-file: ${{ matrix.image }}-sbom.spdx.json
