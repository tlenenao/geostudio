name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  test-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build postgis+pgvector image
        run: docker build -t geostudio-postgis-ci:latest ./deploy/postgis

      - name: Start Postgres
        # Les deux derniers flags doivent rester alignés sur le job `core` de
        # ci.yml : sans `wal_level=logical`, les tests `@pytest.mark.postgis`
        # du consommateur CDC (SP-11) échouent en
        # « logical decoding requires wal_level >= logical ». Cette porte de
        # release avait dérivé de la CI sans que personne ne le voie — la
        # dernière release taguée (`v0.1.0-rc1`, 2026-07-15) est antérieure à
        # ces tests, donc cette porte ne les avait jamais exécutés.
        # `test_release_gate_starts_postgres_like_ci` garde l'alignement.
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=gis -e POSTGRES_PASSWORD=gis -e POSTGRES_DB=gis \
            -p 5432:5432 geostudio-postgis-ci:latest \
            -c wal_level=logical \
            -c output_plugin_libraries=wal2json,pgoutput,test_decoding
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U gis && break
            sleep 2
          done

      - uses: astral-sh/setup-uv@v7

      - name: Migrations up/down
        working-directory: core
        env:
          DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis
        run: |
          uv sync
          uv run alembic upgrade head
          uv run alembic downgrade base

      - name: Core tests
        working-directory: core
        env:
          CORE_TEST_DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis
        run: |
          uv run pytest
          uv run lint-imports

      - name: Stop Postgres
        if: always()
        run: docker rm -f ci-postgres
        # Frees the runner's CPU/memory before the Playwright step, which
        # unlike ci.yml's isolated `shell` job shares this single runner
        # with the migrations/core steps above (test-gate merges all three
        # by design, cf. spec). An idle-but-running container left over
        # here was enough contention to make admin-collections.spec.ts's
        # final assertion (5s window for a dialog-close + refetch cycle)
        # miss deterministically, while the same test passes cleanly when
        # `shell` runs alone.

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Shell tests
        working-directory: shell
        run: |
          npm ci
          npm run test
          npx playwright install --with-deps chromium
          npm run e2e
          npm run build

  test-gate-arm64:
    # Duplique test-gate sur un runner arm64 NATIF (gratuit pour les dépôts
    # publics) — pas seulement une vérification que le build buildx aboutit
    # (ça, c'est le rôle de build-and-push sous QEMU), mais
    # Postgres/PostGIS/pgvector/wal2json réellement démarrés et exercés par
    # la suite de tests sur du vrai matériel arm64. Contrairement à
    # build-and-push, une exécution de tests sous émulation QEMU ne
    # prouverait rien de fiable (temporisations, I/O, JIT).
    #
    # Le volet shell (Vitest/Playwright/`npm run build`) n'est PAS dupliqué
    # ici : JS/TS pur, aucune dépendance native, le job amd64 (test-gate)
    # suffit à le garantir.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build postgis+pgvector image
        run: docker build -t geostudio-postgis-ci:latest ./deploy/postgis

      - name: Start Postgres
        run: |
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=gis -e POSTGRES_PASSWORD=gis -e POSTGRES_DB=gis \
            -p 5432:5432 geostudio-postgis-ci:latest \
            -c wal_level=logical \
            -c output_plugin_libraries=wal2json,pgoutput,test_decoding
          for i in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U gis && break
            sleep 2
          done

      - uses: astral-sh/setup-uv@v7

      - name: Migrations up/down
        working-directory: core
        env:
          DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis
        run: |
          uv sync
          uv run alembic upgrade head
          uv run alembic downgrade base

      - name: Core tests
        working-directory: core
        env:
          CORE_TEST_DATABASE_URL: postgresql+psycopg://gis:gis@localhost:5432/gis
        run: |
          uv run pytest
          uv run lint-imports

      - name: Stop Postgres
        if: always()
        run: docker rm -f ci-postgres

      - name: Build + smoke-test titiler (arm64)
        run: |
          docker build -t geostudio-titiler-ci:latest ./deploy/titiler
          docker run -d --name ci-titiler -e PORT=8000 -p 8000:8000 geostudio-titiler-ci:latest
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/healthz
          docker rm -f ci-titiler

  build-and-push:
    needs: [test-gate, test-gate-arm64]
    uses: ./.github/workflows/_build-and-push.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      image_tag: ${{ github.ref_name }}
      also_tag_latest: true
      run_scans: true
    secrets: inherit

  verify-published:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Spécifier N'IMPORTE quelle permission met TOUTES les autres à `none`
    # (règle GitHub) — `contents: read` doit rester explicite ici pour que
    # `actions/checkout` fonctionne, sinon il aurait silencieusement perdu
    # l'accès qu'il tenait implicitement des permissions par défaut du
    # dépôt (revue du correctif de la revue finale, N1).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Vérifie que les 9 images existent sous ce tag
        working-directory: core
        env:
          # Sans authentification, "jamais publiée" et "publiée mais
          # encore privée" renvoient le même 403 (vérifié empiriquement
          # contre le vrai registre) — un nouveau package GHCR naît privé
          # par défaut, ce qui aurait rendu ce garde-fou rouge au tout
          # premier succès de publication de geostudio-titiler.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          uv sync
          uv run python scripts/check_published_images.py "$IMAGE_TAG"
