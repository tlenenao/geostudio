networks:
  gis-net:
    driver: bridge

volumes:
  pg-data:
  minio-data:
  keycloak-data:
  etl-scratch:
  appexport-runtime:

services:

  # ─── Base de données ───────────────────────────────────

  postgis:
    build: ./deploy/postgis
    environment:
      POSTGRES_DB: gis
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [gis-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_buffers=2GB
        -c effective_cache_size=6GB
        -c work_mem=64MB
        -c max_connections=200
        -c random_page_cost=1.1
        -c max_parallel_workers_per_gather=4
        -c wal_level=logical
        -c output_plugin_libraries=wal2json,pgoutput,test_decoding

  pgbouncer:
    image: edoburu/pgbouncer:1.22.1-p0
    environment:
      DB_HOST: postgis
      DB_NAME: gis
      DB_USER: gis
      DB_PASSWORD: ${PG_PASSWORD}
      LISTEN_PORT: 6432 # every consumer's DATABASE_URL connects to pgbouncer:6432; the image defaults to 5432 without this
      AUTH_TYPE: scram-sha-256 # matches postgis:16's default password encryption; without this pgbouncer can't authenticate against it
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 50
    depends_on:
      postgis:
        condition: service_healthy
    networks: [gis-net]

  # ─── Stockage objet ────────────────────────────────────

  minio:
    # Pin explicite (SP-21) : cette ligne était sans tag, donc `latest` —
    # le stockage objet de toutes les données du produit changeait de
    # version à chaque pull.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes: [minio-data:/data]
    ports:
      - "9001:9001"
    command: server /data --console-address ":9001"
    networks: [gis-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Serveurs de tuiles ────────────────────────────────

  martin:
    image: ghcr.io/maplibre/martin:v0.18.0
    environment:
      DATABASE_URL: postgresql://gis:${PG_PASSWORD}@pgbouncer:6432/gis
    volumes:
      - ./martin-config.yaml:/config.yaml
    command: --config /config.yaml
    ports:
      - "3000:3000"
    networks: [gis-net]
    depends_on:
      pgbouncer:
        condition: service_started

  titiler:
    image: ghcr.io/developmentseed/titiler:0.18.4
    environment:
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif,.TIF,.tiff
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: YES
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      AWS_ACCESS_KEY_ID: ${MINIO_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
      AWS_ENDPOINT_URL: http://minio:9000
      # rio-tiler ouvre `s3://…` via le driver /vsis3/ de GDAL, qui ne lit
      # PAS AWS_ENDPOINT_URL (nom boto3/AWS SDK) mais ses propres variables :
      # AWS_S3_ENDPOINT au format host:port SANS schéma, plus AWS_HTTPS pour
      # dire que MinIO est en clair sur le réseau interne et
      # AWS_VIRTUAL_HOSTING=FALSE pour l'adressage path-style (MinIO ne sert
      # pas bucket.host). Sans elles, /vsis3/ vise le vrai s3.amazonaws.com.
      AWS_S3_ENDPOINT: minio:9000
      AWS_HTTPS: "NO"
      AWS_VIRTUAL_HOSTING: "FALSE"
    ports:
      - "8000:8000"
    networks: [gis-net]

  # ─── Applications ──────────────────────────────────────

  # Cœur GeoStudio (ex builder-service, renommé — arbitrage A14 de la feuille de route).
  core:
    build: ./core
    # Applique les migrations Alembic à chaque démarrage du conteneur, avant
    # de servir — idempotent (Alembic ne réapplique jamais une révision déjà
    # appliquée), même patron que le `command:` du service `worker` plus bas
    # (`schema --apply && …`). `alembic upgrade head`, pas `uv run alembic
    # upgrade head` : cette image n'est pas gérée en mode projet uv (cf.
    # commentaire du service `worker`).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8200"
    environment:
      DATABASE_URL: postgresql+psycopg://gis:${PG_PASSWORD}@pgbouncer:6432/gis
      CORE_AUTH_MODE: ${CORE_AUTH_MODE:-mock}
      CORE_OIDC_ISSUER: ${CORE_OIDC_ISSUER:-http://localhost:8180/realms/geostudio}
      CORE_OIDC_AUDIENCE: ${CORE_OIDC_AUDIENCE:-geostudio-core}
      CORE_OIDC_JWKS_URL: ${CORE_OIDC_JWKS_URL:-http://keycloak:8080/realms/geostudio/protocol/openid-connect/certs}
      CORE_MCP_AUDIENCE: ${CORE_MCP_AUDIENCE:-geostudio-mcp}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://localhost:8200}
      # Cible interne du rappel /mcp du copilote — jamais l'URL publique
      # (cf. .env.example et app/copilot/mcp_loopback.loopback_base_url).
      CORE_INTERNAL_BASE_URL: ${CORE_INTERNAL_BASE_URL:-http://localhost:8200}
      CORE_LLM_PROVIDER: ${CORE_LLM_PROVIDER:-}
      CORE_LLM_API_URL: ${CORE_LLM_API_URL:-}
      CORE_LLM_API_KEY: ${CORE_LLM_API_KEY:-}
      CORE_LLM_MODEL: ${CORE_LLM_MODEL:-gpt-4o-mini}
      CORE_READ_ONLY_MODE: ${CORE_READ_ONLY_MODE:-false}
      CORE_ADMIN_SUBS: ${CORE_ADMIN_SUBS:-}
      # Rôle analyste (SP-11c) : sans cette ligne, `CORE_ANALYST_SUBS` dans
      # le .env de l'opérateur n'atteignait jamais le process.
      CORE_ANALYST_SUBS: ${CORE_ANALYST_SUBS:-}
      # Capacité ETL (SP-15a). Était documentée dans .env.example et nommée
      # dans un commentaire de ce fichier, mais transmise à aucun service :
      # toute la surface pipelines (REST + MCP + sidecar QGIS + cron) était
      # inatteignable en stack packagée, sans le moindre signal. Doit valoir
      # la même chose ici et sur `worker` (qui consomme la file `etl`) —
      # même exigence que CORE_EXPORT_ENABLED entre core et export-worker.
      CORE_ETL_ENABLED: ${CORE_ETL_ENABLED:-false}
      # Fournisseur d'embeddings de la recherche sémantique (SP-7). Non
      # câblé jusqu'ici : le cœur retombait silencieusement sur son défaut.
      # Défauts `fake`/`text-embedding-3-small` ici, pas une substitution à
      # défaut vide : ce sont les vrais défauts applicatifs de
      # get_embedding_provider() (core/app/search/providers.py) — un
      # défaut de compose vide sur ces deux-là ferait planter la recherche
      # sémantique là où elle marchait avant le câblage (ValueError sur
      # provider inconnu), l'image inverse du bug que cette même tâche
      # corrige par ailleurs. API_URL/API_KEY n'ont pas de défaut
      # applicatif (lus via `os.environ[...]`, seulement quand
      # provider="openai") : une substitution à défaut vide reste correcte
      # pour ces deux-là, même patron que CORE_LLM_API_*.
      CORE_EMBEDDING_PROVIDER: ${CORE_EMBEDDING_PROVIDER:-fake}
      CORE_EMBEDDING_API_URL: ${CORE_EMBEDDING_API_URL:-}
      CORE_EMBEDDING_API_KEY: ${CORE_EMBEDDING_API_KEY:-}
      CORE_EMBEDDING_MODEL: ${CORE_EMBEDDING_MODEL:-text-embedding-3-small}
      # Allowlists des trois gardes d'egress SSRF (pipelines/harvest/alerts,
      # chacune dupliquée délibérément — cf. leurs docstrings respectives).
      # Trouvées non câblées à AUCUN service par l'élargissement de la règle
      # ci-dessous (angle mort de l'ancienne regex ENV_READ_RE, qui ne voyait
      # pas la lecture indirecte via `_ALLOWLIST_ENV = "CORE_..."`) — deux des
      # trois étaient déjà documentées dans .env.example, donc *crues*
      # câblées, sur une garde SSRF. Défaut vide = comportement inchangé
      # (seules les plages réseau internes/privées sont bloquées, cf.
      # `_allowlist()` de chaque module).
      CORE_PIPELINES_EGRESS_ALLOWLIST: ${CORE_PIPELINES_EGRESS_ALLOWLIST:-}
      CORE_HARVEST_EGRESS_ALLOWLIST: ${CORE_HARVEST_EGRESS_ALLOWLIST:-}
      CORE_ALERTS_EGRESS_ALLOWLIST: ${CORE_ALERTS_EGRESS_ALLOWLIST:-}
      CORE_SECRETS_MASTER_KEY: ${CORE_SECRETS_MASTER_KEY}
      CORE_EXPORT_ENABLED: ${CORE_EXPORT_ENABLED:-false}
      CORE_EXPORT_TOKEN_SECRET: ${CORE_EXPORT_TOKEN_SECRET:-}
      CORE_TILESET3D_ENABLED: ${CORE_TILESET3D_ENABLED:-false}
      # Plafond de lecture du proxy tileset3d (read_tileset3d_entry,
      # app/tileset3d/routes.py) — s'exécute dans ce process (`core`), pas
      # dans `worker` : les trois plafonds de VALIDATION ci-dessous
      # n'appartiennent qu'à `worker` (cf. ce service plus bas).
      CORE_TILESET3D_MAX_PROXY_READ_BYTES: ${CORE_TILESET3D_MAX_PROXY_READ_BYTES:-134217728}
      CORE_TERRAIN3D_ENABLED: ${CORE_TERRAIN3D_ENABLED:-false}
      S3_TERRAIN3D_BUCKET: geostudio-terrain3d
      # Titiler sert les tuiles terrain-RGB depuis le COG hébergé (proxy
      # read_terrain3d_tile, app/terrain3d/routes.py) — appel interne, jamais
      # exposé au navigateur.
      TITILER_URL: ${TITILER_URL:-http://titiler:8000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SERVICE_NAME: geostudio-core
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_THUMBNAILS_BUCKET: geostudio-thumbnails
      S3_UPLOADS_BUCKET: geostudio-uploads
      S3_CDC_BUCKET: geostudio-cdc
      S3_TILESET3D_BUCKET: geostudio-tileset3d
      CORE_APPEXPORT_ENABLED: ${CORE_APPEXPORT_ENABLED:-false}
    ports:
      - "8200:8200"
    networks: [gis-net]
    depends_on: [pgbouncer, minio, titiler]
    restart: unless-stopped
    # `start_period` généreux : ce service applique les migrations Alembic
    # avant de servir (cf. `command:`), et rien n'attendait la fin de cette
    # étape avant de router vers lui (I5 du plan d'action 2026-08-20).
    # `python`, pas `curl` : l'image est python:3.12-slim, sans curl.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    labels:
      - traefik.enable=true
      - traefik.http.routers.core.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.core.entrypoints=websecure
      - traefik.http.routers.core.tls.certresolver=letsencrypt
      - traefik.http.routers.core.priority=10
      - traefik.http.routers.core.middlewares=security-headers@docker,rate-limit@docker,strip-api@docker
      - traefik.http.services.core.loadbalancer.server.port=8200
      - traefik.http.middlewares.strip-api.stripprefix.prefixes=/api
      - traefik.http.middlewares.security-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.security-headers.headers.frameDeny=true
      - traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin
      - traefik.http.middlewares.rate-limit.ratelimit.average=100
      - traefik.http.middlewares.rate-limit.ratelimit.burst=200

  # Worker d'ingestion (SP-6a) — même image que le cœur, process séparé
  # (procrastinate worker, file Postgres, pas de broker — arbitrage A5).
  worker:
    build: ./core
    # `python -m procrastinate` (pas le script `procrastinate` du PATH) : ce
    # dernier ne met jamais le cwd (/app, où vit le paquet `app`) sur
    # sys.path — seule l'invocation via `-m` (comme `-c`) le fait. Sans ça,
    # le chargement de `app.jobs.app` échoue ("Could not load app from
    # app.jobs.app") avant même d'atteindre le connecteur.
    command: >
      sh -c "python -m scripts.ensure_procrastinate_schema &&
             python -m procrastinate --app app.jobs.app worker -q ingestion,search,cdc,etl,tileset3d,terrain3d,appexport"
    environment:
      DATABASE_URL: postgresql+psycopg://gis:${PG_PASSWORD}@pgbouncer:6432/gis
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_UPLOADS_BUCKET: geostudio-uploads
      S3_CDC_BUCKET: geostudio-cdc
      S3_TILESET3D_BUCKET: geostudio-tileset3d
      # Plafonds de validation tileset3d (finalize_tileset3d_task,
      # app/tileset3d/jobs.py) — s'exécutent dans ce process (`worker`), pas
      # dans `core` : le plafond de LECTURE du proxy est côté `core` (cf. ce
      # service plus haut), pas ici.
      CORE_TILESET3D_MAX_ENTRIES: ${CORE_TILESET3D_MAX_ENTRIES:-20000}
      CORE_TILESET3D_MAX_TOTAL_BYTES: ${CORE_TILESET3D_MAX_TOTAL_BYTES:-21474836480}
      # Miroir des lignes du service `core` : le worker exécute les jobs
      # d'indexation sémantique (file `search`) et les runs de pipeline
      # (file `etl`). Une valeur divergente entre les deux services produit
      # une capacité à moitié allumée — précédent SP-17a.
      CORE_ETL_ENABLED: ${CORE_ETL_ENABLED:-false}
      # Miroir des défauts du service `core` ci-dessus (mêmes commentaires) :
      # `fake`/`text-embedding-3-small`, pas une substitution à défaut vide,
      # pour ne pas diverger d'un défaut applicatif qui marchait avant le
      # câblage.
      CORE_EMBEDDING_PROVIDER: ${CORE_EMBEDDING_PROVIDER:-fake}
      CORE_EMBEDDING_API_URL: ${CORE_EMBEDDING_API_URL:-}
      CORE_EMBEDDING_API_KEY: ${CORE_EMBEDDING_API_KEY:-}
      CORE_EMBEDDING_MODEL: ${CORE_EMBEDDING_MODEL:-text-embedding-3-small}
      # Miroir des lignes du service `core` ci-dessus (mêmes commentaires) :
      # les runs de pipeline (connector_runtime.py) et les notifications
      # d'alerte (notify.py) tournent dans ce process.
      CORE_PIPELINES_EGRESS_ALLOWLIST: ${CORE_PIPELINES_EGRESS_ALLOWLIST:-}
      CORE_HARVEST_EGRESS_ALLOWLIST: ${CORE_HARVEST_EGRESS_ALLOWLIST:-}
      CORE_ALERTS_EGRESS_ALLOWLIST: ${CORE_ALERTS_EGRESS_ALLOWLIST:-}
      CORE_TILESET3D_MAX_ENTRY_BYTES: ${CORE_TILESET3D_MAX_ENTRY_BYTES:-2147483648}
      S3_TERRAIN3D_BUCKET: geostudio-terrain3d
      # Plafonds terrain3d (convert_terrain3d_task, app/terrain3d/jobs.py) —
      # s'exécutent dans ce process (`worker`).
      CORE_TERRAIN3D_MAX_UPLOAD_BYTES: ${CORE_TERRAIN3D_MAX_UPLOAD_BYTES:-2147483648}
      CORE_TERRAIN3D_CONVERSION_TIMEOUT_SECONDS: ${CORE_TERRAIN3D_CONVERSION_TIMEOUT_SECONDS:-900}
      CORE_BASE_URL: ${CORE_BASE_URL:-http://localhost:8200}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SERVICE_NAME: geostudio-worker
      QGIS_WORKER_URL: http://qgis-worker:8000
      QGIS_WORKER_TIMEOUT_SECONDS: "600"
      CORE_APPEXPORT_ENABLED: ${CORE_APPEXPORT_ENABLED:-false}
      APPEXPORT_RUNTIME_DIR: /export-runtime
      S3_APPEXPORTS_BUCKET: geostudio-appexports
    volumes:
      - etl-scratch:/scratch
      - appexport-runtime:/export-runtime:ro
    networks: [gis-net]
    depends_on:
      pgbouncer:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped
    # `procrastinate healthchecks` vérifie la connexion et le schéma de la
    # file. Limite connue et assumée : un worker occupé par une tâche qui ne
    # rend jamais la main reste « healthy » — cette sonde détecte un worker
    # mort ou déconnecté de la base, pas un worker coincé.
    healthcheck:
      test: ["CMD", "python", "-m", "procrastinate", "--app", "app.jobs.app", "healthchecks"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Bâtit une fois le runtime d'export statique générique et le dépose dans
  # le volume `appexport-runtime`, consommé par `worker` (SP-18a). Tourne
  # une seule fois par `docker compose up --profile appexport` (aucun
  # `restart:`). Profil `appexport` : un `docker compose up` par défaut ne
  # le démarre pas, même porte que CORE_APPEXPORT_ENABLED — `worker` n'a
  # donc plus de hard `depends_on` dessus (Compose refuse de mélanger un
  # `depends_on` dur sur un service à profil avec ce profil inactif) ; si
  # le profil n'est pas actif, le volume `appexport-runtime` reste
  # simplement vide et `build_app_export_task` échoue proprement avec un
  # message `FileNotFoundError` explicite (comportement existant, Task 6).
  appexport-runtime-builder:
    build:
      context: .
      dockerfile: deploy/appexport-runtime-builder/Dockerfile
    profiles: ["appexport"]
    volumes:
      - appexport-runtime:/export-runtime
    networks: [gis-net]

  # Sidecar QGIS Processing étage 2 (SP-15d, arbitrage A39 — GPL en
  # sous-processus isolé, cœur Apache-2.0 intact). Profil `etl` : un
  # `docker compose up` par défaut ne le démarre pas, même porte que
  # CORE_ETL_ENABLED. Aucune credential DB, aucun accès réseau externe —
  # ne voit que le volume scratch partagé avec `worker` (garde
  # anti-confused-deputy, patron SP-6a).
  qgis-worker:
    build: ./deploy/qgis-worker
    profiles: ["etl"]
    environment:
      QT_QPA_PLATFORM: offscreen
    volumes:
      - etl-scratch:/scratch
    networks: [gis-net]
    restart: unless-stopped

  # Worker d'export Playwright (SP-17a, A25) — image dédiée (Chromium +
  # dépendances système), séparée du worker partagé pour ne pas l'alourdir
  # pour tout le monde. Profil `export` : un `docker compose up` par défaut
  # ne le démarre pas, même porte que CORE_EXPORT_ENABLED. Aucun volume
  # partagé requis : le rendu (screenshot/PDF) reste en mémoire, upload S3
  # direct — pas d'intermédiaire disque comme etl-scratch.
  export-worker:
    build:
      context: ./core
      dockerfile: ../deploy/export-worker/Dockerfile
    profiles: ["export"]
    command: python -m procrastinate --app app.jobs.app worker -q export
    environment:
      DATABASE_URL: postgresql+psycopg://gis:${PG_PASSWORD}@pgbouncer:6432/gis
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_EXPORTS_BUCKET: geostudio-exports
      # Doit suivre la même variable que le service `core` (ci-dessus) — pas
      # de valeur figée "true" : un worker qui rend une page pendant que
      # `core` refuse le jeton d'export (CORE_EXPORT_ENABLED absent/false
      # côté core) produirait une capture "Accès refusé" silencieuse plutôt
      # qu'un état explicitement coupé (revue finale SP-17a, C3).
      CORE_EXPORT_ENABLED: ${CORE_EXPORT_ENABLED:-false}
      CORE_EXPORT_TOKEN_SECRET: ${CORE_EXPORT_TOKEN_SECRET}
      SHELL_BASE_URL: ${SHELL_BASE_URL:-http://shell:8300}
    networks: [gis-net]
    depends_on:
      pgbouncer:
        condition: service_started
      minio:
        condition: service_healthy
      core:
        condition: service_healthy
    restart: unless-stopped

  # Worker CDC (SP-11a) — même image que le cœur, process séparé (arbitrage
  # A16). Connexion DIRECTE à postgis:5432, PAS à pgbouncer:6432 : PgBouncer
  # est en POOL_MODE transaction, incompatible avec le protocole de
  # réplication logique. Service métier essentiel dès que SP-11 est livré,
  # pas un outil d'exploitation optionnel — pas de profil, comme core/worker.
  cdc-worker:
    build: ./core
    command: python -m app.cdc.main
    environment:
      CDC_DATABASE_URL: postgresql://gis:${PG_PASSWORD}@postgis:5432/gis
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_USER}
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_CDC_BUCKET: geostudio-cdc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SERVICE_NAME: geostudio-cdc-worker
    networks: [gis-net]
    depends_on:
      postgis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    # Sonde côté serveur (scripts/healthcheck_cdc.py) : le slot de
    # réplication n'est `active` que tant qu'un consommateur le tient. Seule
    # des quatre à détecter le « vivant mais ne consomme plus ».
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck_cdc"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Observabilité (SP-10b, profil optionnel) ──────────

  # Grafana (:3001 côté hôte — :3000 est déjà pris par martin ci-dessus,
  # le port interne du conteneur reste 3000) + Prometheus/Loki/Tempo
  # embarqués. `otelcol-config.yaml` remplace entièrement la config par
  # défaut du collecteur embarqué (pas de fusion partielle) et lui ajoute
  # le scraping Prometheus de martin/postgres-exporter (cf. Task 2).
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.4
    profiles: ["observability"]
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./deploy/observability/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml
      - ./deploy/observability/grafana/provisioning/dashboards/geostudio-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/geostudio-dashboards.yaml
      - ./deploy/observability/grafana/provisioning/dashboards/custom:/otel-lgtm/grafana/conf/provisioning/dashboards/custom
      - ./deploy/observability/grafana/provisioning/alerting:/otel-lgtm/grafana/conf/provisioning/alerting
    networks: [gis-net]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    profiles: ["observability"]
    environment:
      DATA_SOURCE_NAME: postgresql://gis:${PG_PASSWORD}@pgbouncer:6432/gis?sslmode=disable
    networks: [gis-net]
    depends_on:
      pgbouncer:
        condition: service_started

  # ─── Auth ──────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgis:5432/gis
      KC_DB_USERNAME: gis
      KC_DB_PASSWORD: ${PG_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    networks: [gis-net]
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./deploy/keycloak/geostudio-realm.json:/opt/keycloak/data/import/geostudio-realm.json:ro
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  shell:
    build: ./shell
    environment:
      # No-op par défaut : même valeur que l'ARG de build de shell/Dockerfile
      # (http://localhost:8200), injectée au runtime via
      # docker-entrypoint.d/40-render-runtime-config.sh (envsubst ->
      # env-config.js -> shell/src/config.ts::mergeRuntimeEnv). Surcharger
      # VITE_CORE_URL dans .env pour activer un export réel (profil
      # "export") sans rebuild — voir la note détaillée dans .env.example.
      VITE_CORE_URL: ${VITE_CORE_URL:-http://localhost:8200}
    ports:
      - "8300:8300"
    networks: [gis-net]
    restart: unless-stopped
    # Attend que `core` ait fini ses migrations et réponde : le shell sans
    # cœur n'affiche qu'une page d'erreur. Dépendance dure volontairement
    # limitée à `shell` et `export-worker` — SP-18a a dû *retirer* celle de
    # `worker` parce qu'elle bloquait le démarrage pour une capacité
    # désactivée par défaut.
    depends_on:
      core:
        condition: service_healthy
    # `wget` de busybox — l'image est nginx:1.27-alpine, sans curl.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8300/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.shell.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.shell.entrypoints=websecure
      - traefik.http.routers.shell.tls.certresolver=letsencrypt
      - traefik.http.routers.shell.priority=1
      - traefik.http.routers.shell.middlewares=security-headers@docker,rate-limit@docker
      - traefik.http.services.shell.loadbalancer.server.port=8300

  # ─── Ingress ───────────────────────────────────────────

  traefik:
    image: traefik:v3.0.4
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/certs
    networks: [gis-net]
