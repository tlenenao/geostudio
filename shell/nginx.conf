server {
  listen 8300;
  root /usr/share/nginx/html;
  index index.html;

  # nginx:1.27 ne connaît pas `.mjs` : sans ce type, le worker MapLibre part en
  # application/octet-stream + nosniff et ne démarre jamais (j12-001). `types`
  # dans un `server` REMPLACE le mime.types global : on le réinclut d'abord.
  include /etc/nginx/mime.types;
  types { text/javascript mjs; }

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Un add_header dans un `location` masque ceux du `server` : les en-têtes de
  # sécurité vivent dans un snippet inclus à chaque niveau.
  include /etc/nginx/snippets/security-headers.conf;
  # La CSP est désormais portée exclusivement par Traefik (middleware
  # csp-dynamic@file, cf. SP-48/GAP-72) — dans toute topologie documentée
  # par ce dépôt, shell sert toujours derrière Traefik (11 services par
  # défaut, CLAUDE.md §Commandes). Un accès direct au port publié de ce
  # conteneur, hors Traefik, ne reçoit aucune CSP : ce n'est pas une
  # topologie de production documentée.

  # Chunks hachés par contenu : immuables. Un chunk absent (onglet ouvert
  # avant un déploiement) doit répondre 404, pas index.html en 200 (t03-003).
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    # Pas de drapeau de forçage ici : un 404 ne doit jamais être mis en cache.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Seules exceptions non hachées de /assets/ (vite.copyMaplibreWorker.ts) :
  # revalidation, jamais immutable.
  location ~ ^/assets/maplibre-gl-(worker|shared)\.mjs$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Jamais servis (retirés de l'image) : 404 plutôt que le repli SPA en 200.
  location ~ ^/(\.vite|fixtures)/ {
    return 404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
