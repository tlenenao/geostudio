[project]
name = "geostudio-core"
version = "0.1.0"
description = "GeoStudio Builder Service — stores and versions App/Dashboard configs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "requests>=2.31",  # SP-15f : garde SSRF pour reader.connector.rest — dlt's
                       # RESTClient utilise `requests`, pas httpx (que le reste
                       # du dépôt utilise déjà) ; déclaré ici en dépendance
                       # directe plutôt que de compter sur la transitive de dlt.
    "dlt>=1.6",  # SP-15f : reader.connector.rest/postgres — extraction,
                # normalisation, inférence de schéma (design §3.1) ; destination
                # duckdb, aucun extra requis (core/déjà présent).
    "psycopg[binary]>=3.1",
    "psycopg2-binary>=2.9",  # SP-11a : seul driver Python avec support du protocole
                             # de réplication logique (psycopg v3 ne l'expose pas) ;
                             # utilisé uniquement par app/cdc/ pour la connexion de
                             # réplication elle-même, psycopg[binary] reste le driver
                             # de tout le reste du cœur.
    "alembic>=1.13",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",  # SP-15e : chiffrement applicatif AES-GCM du
                           # coffre de secrets ; déjà présent transitivement
                           # via pyjwt[crypto] (49.0.0 dans uv.lock, vérifié),
                           # déclaré ici en dépendance directe pour ne pas
                           # dépendre d'une extra tierce pour un import de
                           # production.
    "croniter>=6.2",  # SP-15h : validation + calcul du prochain tick pour
                      # refreshPolicy des pipelines ; déjà dépendance
                      # transitive de procrastinate (utilisée en interne par
                      # @app.periodic), déclarée ici en directe car importée
                      # directement par app.configs et app.pipelines.
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "mcp>=1.12",
    "shapely>=2.0",
    "procrastinate>=2.0",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "defusedxml>=0.7",  # SP-12e : parsing XML sûr (XXE + billion-laughs) des GetCapabilities OGC
    "geopandas>=0.14",  # SP-11a : GeoDataFrame.to_parquet gère nativement les
                        # métadonnées GeoParquet 1.0 ; s'appuie sur shapely,
                        # déjà présent.
    "pyarrow>=15.0",  # SP-11a : requis pour geopandas.to_parquet
    "pgvector>=0.3",
    "duckdb>=1.0",  # SP-11b : module analytique — lit le GeoParquet CDC (SP-11a)
                    # via httpfs (S3/MinIO) + spatial (ST_Intersects sur la colonne
                    # géométrie WKB), connexion in-process éphémère par requête.
    "openpyxl>=3.1",  # SP-16a : sérialisation d'export XLSX (app/analytics/export.py) —
                      # aucune dépendance XLSX n'existait dans le cœur avant ce sous-plan.
    "playwright>=1.45",  # SP-17a : rendu headless Chromium pour l'export
                        # PNG/PDF (app/export/jobs.py) — installé sans le
                        # binaire navigateur par défaut ; `playwright install
                        # --with-deps chromium` est requis en plus (fait dans
                        # le Dockerfile export-worker, tâche 13 ; à faire à la
                        # main en dev local pour lancer les tests marqués
                        # @pytest.mark.playwright de cette tâche).
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-botocore>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "import-linter>=2.0",
    "pip-audit>=2.7",
    "stac-pydantic>=3.1",  # SP-12a : validation de conformité STAC, offline, dep de test uniquement
    "rdflib>=7.0",  # SP-12b : parse JSON-LD pour validation SHACL, dep de test uniquement
    "pyshacl>=0.25",  # SP-12b : validation SHACL contre les shapes DCAT-AP vendues hors-ligne, dep de test uniquement
    "pytest-httpserver>=1.0",  # SP-15f : serveur HTTP local réel pour tester
                               # reader.connector.rest sans réseau (dlt utilise
                               # `requests`, pas httpx — un mock httpx type respx
                               # n'intercepterait rien).
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning:rdflib.plugins.parsers.jsonld",
]
markers = [
    "postgis: nécessite un PostGIS réel (CORE_TEST_DATABASE_URL) ; skippé sinon",
    "qgis: nécessite un sidecar qgis-worker réel (CORE_TEST_QGIS_WORKER_URL) ; skippé sinon",
    "playwright: nécessite le binaire Chromium (playwright install --with-deps chromium) ; skippé sinon",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
layers = [
    "app.main",
    "app.mcp",
    "app.public",
    "app.harvest",
    "app.pipelines",
    "app.alerts",
    "app.export",
    "app.secrets",
    "app.ingestion",
    "app.dcat",
    "app.stac",
    "app.features",
    "app.collections",
    "app.configs",
    "app.extensions",
    "app.items",
    "app.sharing",
    "app.auth",
    "app.audit",
    "app.users",
    "app.tenants",
]
ignore_imports = [
    "app.db -> app.configs.models",
    "app.db -> app.collections.models",
    "app.db -> app.items.models",
    "app.db -> app.audit.models",
    "app.db -> app.tenants.models",
    "app.db -> app.users.models",
    "app.db -> app.sharing.models",
    "app.db -> app.ingestion.models",
    "app.db -> app.extensions.models",
    "app.db -> app.harvest.models",
    "app.db -> app.pipelines.models",
    "app.db -> app.alerts.models",
    "app.db -> app.secrets.models",
    "app.db -> app.export.models",
]
