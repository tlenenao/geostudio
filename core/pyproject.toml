[project]
name = "geostudio-core"
version = "0.1.0"
description = "GeoStudio Builder Service — stores and versions App/Dashboard configs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.8",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "mcp>=1.12",
    "shapely>=2.0",
    "procrastinate>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "import-linter>=2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "postgis: nécessite un PostGIS réel (CORE_TEST_DATABASE_URL) ; skippé sinon",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
layers = [
    "app.main",
    "app.mcp",
    "app.public",
    "app.ingestion",
    "app.features",
    "app.collections",
    "app.configs",
    "app.items",
    "app.sharing",
    "app.auth",
    "app.audit",
    "app.users",
    "app.tenants",
]
ignore_imports = [
    "app.db -> app.configs.models",
    "app.db -> app.collections.models",
    "app.db -> app.items.models",
    "app.db -> app.audit.models",
    "app.db -> app.tenants.models",
    "app.db -> app.users.models",
    "app.db -> app.sharing.models",
    "app.db -> app.ingestion.models",
]
