[project]
name = "geostudio-core"
version = "0.1.0"
description = "GeoStudio Builder Service — stores and versions App/Dashboard configs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "requests>=2.31",  # SP-15f : garde SSRF pour reader.connector.rest — dlt's
                       # RESTClient utilise `requests`, pas httpx (que le reste
                       # du dépôt utilise déjà) ; déclaré ici en dépendance
                       # directe plutôt que de compter sur la transitive de dlt.
    "dlt>=1.6",  # SP-15f : reader.connector.rest/postgres — extraction,
                # normalisation, inférence de schéma (design §3.1) ; destination
                # duckdb, aucun extra requis (core/déjà présent).
    "psycopg[binary]>=3.1",
    "psycopg2-binary>=2.9",  # SP-11a : seul driver Python avec support du protocole
                             # de réplication logique (psycopg v3 ne l'expose pas) ;
                             # utilisé uniquement par app/cdc/ pour la connexion de
                             # réplication elle-même, psycopg[binary] reste le driver
                             # de tout le reste du cœur.
    "alembic>=1.13",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",  # SP-15e : chiffrement applicatif AES-GCM du
                           # coffre de secrets ; déjà présent transitivement
                           # via pyjwt[crypto] (49.0.0 dans uv.lock, vérifié),
                           # déclaré ici en dépendance directe pour ne pas
                           # dépendre d'une extra tierce pour un import de
                           # production.
    "croniter>=6.2",  # SP-15h : validation + calcul du prochain tick pour
                      # refreshPolicy des pipelines ; déjà dépendance
                      # transitive de procrastinate (utilisée en interne par
                      # @app.periodic), déclarée ici en directe car importée
                      # directement par app.configs et app.pipelines.
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "mcp>=1.12,<2.0",
    "shapely>=2.0",
    "procrastinate>=2.0",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "rasterio>=1.3",  # terrain3d : lecture/écriture GeoTIFF (GDAL embarqué
                      # dans la wheel, pas de dépendance système séparée à
                      # installer) ; wheel comparable en poids à pyogrio,
                      # déjà présent — pas un sidecar comme qgis-worker.
    "rio-cogeo>=5.3",  # terrain3d : cog_translate/cog_validate — conversion
                       # d'un GeoTIFF brut en Cloud Optimized GeoTIFF et
                       # validation structurelle du résultat.
    "defusedxml>=0.7",  # SP-12e : parsing XML sûr (XXE + billion-laughs) des GetCapabilities OGC
    "geopandas>=0.14",  # SP-11a : GeoDataFrame.to_parquet gère nativement les
                        # métadonnées GeoParquet 1.0 ; s'appuie sur shapely,
                        # déjà présent.
    "pyarrow>=15.0",  # SP-11a : requis pour geopandas.to_parquet
    "pgvector>=0.3",
    "duckdb>=1.0",  # SP-11b : module analytique — lit le GeoParquet CDC (SP-11a)
                    # via httpfs (S3/MinIO) + spatial (ST_Intersects sur la colonne
                    # géométrie WKB), connexion in-process éphémère par requête.
    "openpyxl>=3.1",  # SP-16a : sérialisation d'export XLSX (app/analytics/export.py) —
                      # aucune dépendance XLSX n'existait dans le cœur avant ce sous-plan.
    "playwright>=1.45",  # SP-17a : rendu headless Chromium pour l'export
                        # PNG/PDF (app/export/jobs.py) — installé sans le
                        # binaire navigateur par défaut ; `playwright install
                        # --with-deps chromium` est requis en plus (fait dans
                        # le Dockerfile export-worker, tâche 13 ; à faire à la
                        # main en dev local pour lancer les tests marqués
                        # @pytest.mark.playwright de cette tâche).
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-botocore>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "import-linter>=2.0",
    "pip-audit>=2.7",
    "stac-pydantic>=3.1",  # SP-12a : validation de conformité STAC, offline, dep de test uniquement
    "rdflib>=7.0",  # SP-12b : parse JSON-LD pour validation SHACL, dep de test uniquement
    "pyshacl>=0.25",  # SP-12b : validation SHACL contre les shapes DCAT-AP vendues hors-ligne, dep de test uniquement
    "pytest-httpserver>=1.0",  # SP-15f : serveur HTTP local réel pour tester
    # reader.connector.rest sans réseau (dlt utilise
    # `requests`, pas httpx — un mock httpx type respx
    # n'intercepterait rien).
    "pyyaml>=6.0",  # SP-21 : tests/test_deployability.py lit les docker-compose*.yml
    # et release.yml. Présent en transitif jusqu'ici — un import
    # direct d'une dépendance non déclarée casse au premier
    # changement d'arbre (même dette que le `anyio` de SP-20).
    "ruff>=0.16.3",
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
    # `pip` n'est pas utilisé directement : il entre par `pip-api`, dépendance
    # de `pip-audit`. Contrainte explicite parce que c'est le seul moyen de
    # faire remonter la version d'une dépendance transitive d'outil — la
    # 26.1.2 que le résolveur choisissait porte PYSEC-2026-3721, et
    # `pip-audit --strict` (qui s'audite donc lui-même) refusait de passer.
    # Jamais embarqué dans une image : outil de dev/CI uniquement.
    "pip>=26.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::DeprecationWarning:rdflib.plugins.parsers.jsonld",
]
markers = [
    "postgis: nécessite un PostGIS réel (CORE_TEST_DATABASE_URL) ; skippé sinon",
    "qgis: nécessite un sidecar qgis-worker réel (CORE_TEST_QGIS_WORKER_URL) ; skippé sinon",
    "playwright: nécessite le binaire Chromium (playwright install --with-deps chromium) ; skippé sinon",
    "docker: nécessite un démon Docker réel (build local de l'image, jamais un pull) ; skippé sinon",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# SP-21 : tests/test_deployability.py est exclu du périmètre de tout le plan
# SP-22 (décision actée dans docs/superpowers/plans/2026-08-20-sp22-filet-
# qualite-statique.md, section Architecture) car modifié en direct par une
# session SP-21 concurrente pendant l'exécution de SP-22 — l'exclure évite
# tout conflit de merge sur un fichier en cours d'itération ailleurs. Non
# compliant même à HEAD ; à retirer de cette liste une fois SP-21 mergé et
# le fichier passé sous ruff format comme le reste de core/.
extend-exclude = ["tests/test_deployability.py"]
# SP-22, revue finale (M2) : sans ce réglage, `extend-exclude` ne s'applique
# qu'à la découverte de fichiers par répertoire (`ruff check .`) — un
# chemin passé *explicitement* en argument reste analysé même s'il matche
# l'exclusion. Or c'est exactement ce que font les hooks pre-commit
# (`ruff-check`/`ruff-format`, cf. .pre-commit-config.yaml), qui reçoivent
# les fichiers stagés en arguments : sans `force-exclude`, committer un
# changement à tests/test_deployability.py le fait lint/formatter par ces
# hooks alors que le plan et la CI l'exemptent délibérément (SP-21, travail
# concurrent). Vérifié : `uv run ruff check .`/`format --check .`
# (invocations réelles de la CI, sans chemin explicite) ne changent pas de
# comportement — l'exclusion s'y appliquait déjà.
#
# SP-22, résidu de revue finale (2026-08-21) : `force-exclude` seul ne
# suffit PAS à protéger le fichier au cwd/chemin réels des hooks pre-commit
# (cwd = racine du dépôt, chemin `core/tests/test_deployability.py`) — le
# motif `tests/test_deployability.py` est matché relatif à la racine de ce
# projet ruff (`core/`), jamais retrouvé dans un chemin qui commence par
# `core/`. Mesuré sur fixture hors dépôt (ni le fichier réel ni ce
# `pyproject.toml` n'ont été modifiés pour le test). L'exemption n'est donc
# réelle que parce que les deux hooks `.pre-commit-config.yaml` font
# désormais `cd core` avant d'invoquer ruff et retirent le préfixe `core/`
# de chaque chemin (idiome `"${@#core/}"`) — `force-exclude = true` reste
# nécessaire (sans lui, même avec ce `cd`, le chemin explicite serait quand
# même analysé) mais n'est plus suffisant seul dans ce commentaire.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# SP-22 Task 4 : sans ce réglage, `mypy --strict app/auth app/secrets
# app/analytics app/copilot` type-vérifie aussi, sous --strict, tout module
# importé transitivement (app/db.py, app/users/repository.py, plusieurs
# models.py…) qui n'est ni dans le périmètre strict déclaré ni dans le
# périmètre de ce plan (13 erreurs mesurées hors des 4 modules avant ce
# réglage). "silent" continue d'utiliser ces modules pour l'inférence de
# types mais n'en fait remonter aucune erreur — seuls les fichiers passés
# explicitement en ligne de commande (les 4 modules stricts, ou tout `app/`
# pour la passe informative) sont rapportés.
follow_imports = "silent"

[tool.ruff.lint.flake8-bugbear]
# B008 (function-call-in-default-argument) faux-positif documenté sur le
# patron d'injection de dépendances FastAPI (`def route(x = Depends(get_x))`)
# — ces appels sont volontairement évalués à chaque requête, ce n'est pas un
# défaut mutable partagé comme le suppose B008. Liste vérifiée par grep
# (2026-08-20) contre les usages réels de core/ : seuls Depends/Query/Header/
# File sont utilisés en position de défaut d'argument ; Body/Path/Cookie/Form/
# Security n'apparaissent nulle part sous cette forme (et les occurrences de
# `Path(` trouvées sont toutes `pathlib.Path`, pas `fastapi.Path`).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.File",
]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
layers = [
    "app.main",
    "app.mcp",
    "app.copilot",
    "app.public",
    "app.harvest",
    "app.pipelines",
    "app.reports",
    "app.alerts",
    "app.export",
    "app.appexport",
    "app.tileset3d",
    "app.terrain3d",
    "app.mapicons",
    "app.admin_tools",
    "app.secrets",
    "app.cdc",
    "app.ingestion",
    "app.notifications",
    "app.dcat",
    "app.stac",
    "app.features",
    "app.collections",
    "app.configs",
    "app.extensions",
    "app.items",
    "app.sharing",
    "app.instance",
    "app.roles",
    "app.auth",
    "app.audit",
    "app.users",
    "app.tenants",
    "app.search",
    "app.analytics",
]
ignore_imports = [
    # `app.analytics` est placé au plus bas du contrat (ajouté par SP-22) : il
    # est consommé par sept modules (configs, features, alerts, appexport,
    # harvest, pipelines, mcp) et ne doit lui-même rien tirer d'au-dessus.
    # Il lit malgré tout le type des colonnes d'une collection avant de
    # construire une requête DuckDB, et il n'existe aucune place linéaire qui
    # le permette : le graphe réel porte un cycle au niveau paquet
    # (`app.analytics` → `app.collections` → `app.configs` → `app.analytics`),
    # antérieur à l'entrée d'`app.analytics` dans le contrat. Ces deux entrées
    # nomment donc l'arête exacte, au module près, plutôt que d'exempter
    # `app.analytics -> app.collections` en entier : `introspection` est un
    # lecteur de catalogue système en lecture seule, tout autre import
    # d'`app.collections` depuis `app.analytics` reste interdit et fera
    # échouer le contrat.
    "app.analytics.aggregate -> app.collections.introspection",
    "app.analytics.sql_sandbox -> app.collections.introspection",
    # `app.auth` est bas dans le contrat car `app.auth.dependency` (surtout
    # `get_current_user`) est consommé par la quasi-totalité des modules —
    # il doit rester proche de la fondation. app.roles doit être AU-DESSUS
    # d'app.auth (ses propres routes, app.roles.routes, ont besoin de
    # get_current_user), mais /me et PATCH /users/{id} (app.auth.routes, EN
    # DESSOUS) doivent lire le rôle et les privilèges de l'appelant/de la
    # cible. Aucune place linéaire du contrat ne permet les deux sens à la
    # fois sans réordonner tout le graphe. Exemption nommée aux arêtes
    # exactes, comme pour `app.analytics` ci-dessus : seules ces trois
    # arêtes sont autorisées, tout autre import d'`app.roles` depuis
    # `app.auth.routes` reste interdit et fera échouer le contrat.
    #
    # Note historique : une exemption `app.auth.routes -> app.sharing.repository`
    # a existé ici (SP-30a Task 2, pour `hasAnyEditorRole` dans `GET /me`) —
    # retirée quand cette tâche a remplacé `isAdmin`/`isAnalyst`/
    # `hasAnyEditorRole` par `role`/`privileges` : `app.auth.routes`
    # n'importe plus rien d'`app.sharing`.
    "app.auth.routes -> app.roles.repository",
    "app.auth.routes -> app.roles.privileges",
    "app.auth.routes -> app.roles.guards",
    # app.roles doit être AU-DESSUS d'app.auth dans ce contrat (ses propres
    # routes, app.roles.routes, ont besoin de get_current_user) — mais
    # get_or_create_user (app.users.repository, sous app.auth) doit résoudre
    # le rôle initial d'un nouvel utilisateur via app.roles.repository.
    # ensure_built_in_roles(). Même classe de tension que l'exemption
    # ci-dessus : aucune place linéaire ne satisfait les deux sens à la fois.
    "app.users.repository -> app.roles.repository",
    "app.db -> app.configs.models",
    "app.db -> app.collections.models",
    "app.db -> app.items.models",
    "app.db -> app.audit.models",
    "app.db -> app.tenants.models",
    "app.db -> app.users.models",
    "app.db -> app.sharing.models",
    "app.db -> app.ingestion.models",
    "app.db -> app.notifications.models",
    "app.db -> app.extensions.models",
    "app.db -> app.harvest.models",
    "app.db -> app.pipelines.models",
    "app.db -> app.alerts.models",
    "app.db -> app.secrets.models",
    "app.db -> app.export.models",
    "app.db -> app.tileset3d.models",
    "app.db -> app.terrain3d.models",
    "app.db -> app.reports.models",
    "app.db -> app.appexport.models",
    "app.db -> app.mapicons.models",
    "app.db -> app.roles.models",
]
